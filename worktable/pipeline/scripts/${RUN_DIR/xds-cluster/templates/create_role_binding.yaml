kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.global.roleBindingName }}  #角色绑定的名称
subjects: #绑定sa
  - kind: ServiceAccount
    name: {{ .Values.global.serviceAccountName }}  #ServiceAccount账号名
    namespace: {{ .Values.global.namespace }}
roleRef: #绑定角色
  kind: ClusterRole
  name: {{ .Values.global.roleName }}  #角色名称
  apiGroup: rbac.authorization.k8s.io
