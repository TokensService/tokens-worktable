apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.serviceAccountSecretName }}  #密钥名称 从1.25开始，新创建的sa不会为其自动创建secret，需要显示创建
  annotations:
    kubernetes.io/service-account.name: {{ .Values.global.serviceAccountName }}  #sa名称 与密钥绑定
  namespace: {{.Values.global.namespace}}
type: kubernetes.io/service-account-token