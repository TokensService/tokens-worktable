apiVersion: v1
kind: Service
metadata:
  name: {{.Values.global.service.svcName}}
  labels:
    app.kubernetes.io/name: ray
  namespace: {{.Values.global.namespace}}
  annotations:
    kubernetes.io/elb.class: performance
    kubernetes.io/elb.id: {{.Values.global.network.elbId}}
    {{- if $.Values.global.useFemFrontend }}
    kubernetes.io/elb.lb-algorithm: LEAST_CONNECTIONS
    {{- else }}
    kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
    {{- end }}
    kubernetes.io/elb.keepalive_timeout: '1000'
    kubernetes.io/elb.health-check-flag: 'on'
    kubernetes.io/elb.health-check-option: '{"protocol":"TCP","delay":"5","timeout":"10","max_retries":"3"}'
spec:
  {{- if $.Values.global.useFemFrontend }}
  # FEM 模式：Service 指向 FE Pods
  selector:
    app: frontend-executor
    xds-component: frontend
  {{- else }}
  # Ray Serve 模式：Service 指向 Ray frontGroup
  selector:
    app.kubernetes.io/created-by: kuberay-operator
    ray.io/group: frontGroup
    in_draining_status: "false"
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- end }}
  # externalTrafficPolicy: Cluster
  {{- if .Values.global.network.ports }}
  ports: {{- toYaml .Values.global.network.ports | nindent 14}}
  {{- end }}
  # type: LoadBalancer
  type: NodePort
