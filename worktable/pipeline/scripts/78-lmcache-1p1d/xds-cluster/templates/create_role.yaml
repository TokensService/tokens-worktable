kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.global.roleName }}    #角色名称
  annotations:
    helm.sh/resource-policy: keep
rules:
  - apiGroups:
      - ""
    resources:
      - pods  #要操作的资源
    verbs:
      - get
      - list
      - create
      - watch
      - delete
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - watch
      - delete
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - create
      - delete
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
      - watch
      - patch
