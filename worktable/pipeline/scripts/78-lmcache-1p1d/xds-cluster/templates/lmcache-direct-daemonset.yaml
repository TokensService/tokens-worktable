{{- $lmcache := .Values.lmcache | default dict }}
{{- $deploymentMode := $lmcache.deploymentMode | default .Values.deploymentMode }}
{{- $direct := $lmcache.direct | default .Values.direct | default dict }}
{{- $common := .Values.common | default dict }}
{{- $commonEnv := $common.containerEnv | default list }}
{{- $directEnv := $direct.env | default list }}
{{- $includeCommonEnv := $direct.includeCommonEnv | default false }}
{{- $env := ternary (concat $commonEnv $directEnv) $directEnv $includeCommonEnv }}
{{- $commonTolerations := $common.tolerations | default list }}
{{- $directTolerations := $direct.tolerations | default list }}
{{- $tolerations := concat $commonTolerations $directTolerations }}
{{- $directEnabled := false }}
{{- if hasKey $direct "enabled" }}
{{- $directEnabled = $direct.enabled }}
{{- end }}
{{- if and (eq $deploymentMode "direct") $directEnabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $direct.name | quote }}
  namespace: {{ include "lmcache.namespace" . | quote }}
  labels:
    app.kubernetes.io/name: lmcache
    app.kubernetes.io/instance: {{ $direct.name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lmcache
      app.kubernetes.io/instance: {{ $direct.name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lmcache
        app.kubernetes.io/instance: {{ $direct.name | quote }}
{{ toYaml $direct.podLabels | indent 8 }}
      {{- with $direct.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
      hostIPC: {{ $direct.hostIPC | default false }}
      hostPID: {{ $direct.hostPID | default false }}
      {{- if $direct.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ $direct.dnsPolicy | default "ClusterFirstWithHostNet" }}
      {{- end }}
      {{- with $direct.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with $direct.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $direct.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $direct.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $direct.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $direct.volumes }}
      volumes:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: lmcache-server
          image: "{{ $direct.image.repository }}:{{ $direct.image.tag }}"
          imagePullPolicy: {{ $direct.image.pullPolicy | quote }}
          {{- with $direct.securityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $env }}
          env:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $direct.volumeMounts }}
          volumeMounts:
{{ toYaml . | indent 12 }}
          {{- end }}
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -e
              ulimit -l unlimited || true
              echo "[zcx] lmcache limits after ulimit:"
              grep -E 'Max locked memory|Max address space|Max resident set' /proc/self/limits || true
              echo "[zcx] skip pre-initializing CUDA contexts; keep all GPUs visible for LMCache runtime"
              python3 -m pip install --no-deps --force-reinstall /opt/lmcache-wheels/lmcache-0.5.1+ppfix1-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
              python3 - <<'PY'
              from pathlib import Path

              path = Path("/usr/local/lib/python3.12/dist-packages/lmcache/integration/vllm/lmcache_mp_connector_0180.py")
              text = path.read_text()
              old = """    return LMCacheMPSchedulerAdapter(\n        server_url,\n        zmq_context,\n"""
              new = """    return LMCacheMPSchedulerAdapter(\n        [server_url],\n        zmq_context,\n"""
              if new not in text:
                  if old not in text:
                      raise RuntimeError("LMCacheMPConnector scheduler server_url patch marker not found")
                  path.write_text(text.replace(old, new, 1))
              print("LMCacheMPSchedulerAdapter server_url list compatibility applied")
              PY
              python3 /opt/lmcache-patches/patch_lmcache_register_busy_tracking.py
              python3 /opt/lmcache-patches/patch_lmcache_mooncake_mq_busy_gate.py
              set -- \
                --host {{ $direct.server.host }} \
                --port {{ $direct.server.port }} \
                --http-host {{ $direct.server.httpHost }} \
                --http-port {{ $direct.server.httpPort }} \
                --l1-init-size-gb {{ $direct.server.l1InitSizeGB }} \
                --l1-size-gb {{ $direct.server.l1SizeGB }} \
                --l1-align-bytes {{ $direct.server.l1AlignBytes }} \
                --chunk-size {{ $direct.server.chunkSize }} \
                --max-workers {{ $direct.server.maxWorkers }} \
                --enable-tracing \
                --otlp-endpoint {{ $direct.server.otlpEndpoint }} \
                --eviction-policy {{ $direct.server.evictionPolicy }} \
                --l2-store-policy {{ $direct.server.l2StorePolicy }}
              {{- if and $direct.server.maxGpuWorkers (ne (toString $direct.server.maxGpuWorkers) "null") }}
              set -- "$@" --max-gpu-workers {{ $direct.server.maxGpuWorkers }}
              {{- end }}
              {{- if and $direct.server.maxCpuWorkers (ne (toString $direct.server.maxCpuWorkers) "null") }}
              set -- "$@" --max-cpu-workers {{ $direct.server.maxCpuWorkers }}
              {{- end }}
              {{- if not $direct.server.l1UseLazy }}
              set -- "$@" --no-l1-use-lazy
              {{- end }}
              {{- range $direct.server.l2Adapters }}
              l2_adapter='{{ toJson . }}'
              echo "[zcx] node=${K8S_NODE_NAME:-unknown} lmcache l2 adapter=${l2_adapter}"
              set -- "$@" --l2-adapter "${l2_adapter}"
              {{- end }}
              {{- if $direct.server.decodePort }}
              prefill_args=("$@")
              decode_args=()
              replace_next=""
              for arg in "$@"; do
                if [ "${replace_next}" = "port" ]; then
                  decode_args+=("{{ $direct.server.decodePort }}")
                  replace_next=""
                  continue
                fi
                if [ "${replace_next}" = "http-port" ]; then
                  decode_args+=("{{ $direct.server.decodeHttpPort }}")
                  replace_next=""
                  continue
                fi
                decode_args+=("${arg}")
                case "${arg}" in
                  --port) replace_next="port" ;;
                  --http-port) replace_next="http-port" ;;
                esac
              done
              CUDA_VISIBLE_DEVICES={{ $direct.server.prefillCudaVisibleDevices | quote }} lmcache server "${prefill_args[@]}" &
              prefill_pid=$!
              CUDA_VISIBLE_DEVICES={{ $direct.server.decodeCudaVisibleDevices | quote }} lmcache server "${decode_args[@]}" &
              decode_pid=$!
              wait -n "${prefill_pid}" "${decode_pid}"
              {{- else }}
              exec lmcache server "$@"
              {{- end }}
          ports:
            - name: zmq
              containerPort: {{ $direct.server.port }}
              protocol: TCP
            - name: http
              containerPort: {{ $direct.server.httpPort }}
              protocol: TCP
            {{- if $direct.server.decodePort }}
            - name: zmq-decode
              containerPort: {{ $direct.server.decodePort }}
              protocol: TCP
            - name: http-decode
              containerPort: {{ $direct.server.decodeHttpPort }}
              protocol: TCP
            {{- end }}
          {{- with $direct.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $direct.volumeMounts }}
          volumeMounts:
{{ toYaml . | indent 12 }}
          {{- end }}
{{- end }}
