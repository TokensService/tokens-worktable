{{- if $.Values.global.useFemFrontend }}
{{- $values := $.Values.feTemplate }}
{{- $portObj := index $.Values.global.network.ports 0 -}}
{{- $targetPort := index $portObj "targetPort" -}}
{{- $scheme := "HTTP" }}
{{- if $.Values.global.ssl.httpSslEnable }}
{{- $scheme = "HTTPS" }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-executor
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend-executor
    xds-component: frontend
    helm.sh/chart: {{ include "ray-cluster.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ $values.default_replica }}
  selector:
    matchLabels:
      app: frontend-executor
      xds-component: frontend
  template:
    metadata:
      {{- if $values.annotations }}
      annotations: {{- toYaml $values.annotations | nindent 8 }}
      {{- end }}
      {{- if $values.labels }}
      labels:
        app: frontend-executor
        xds-component: frontend
        ray.io/group: frontGroup
        {{- toYaml $values.labels | nindent 8 }}
      {{- else }}
      labels:
        app: frontend-executor
        xds-component: frontend
        ray.io/group: frontGroup
      {{- end }}
    spec:
      restartPolicy: "Always"
      automountServiceAccountToken: {{ $.Values.global.enableAutomountServiceAccountToken | default true }}
      imagePullSecrets: {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      {{- if $.Values.global.serviceAccountName }}
      serviceAccountName: {{ $.Values.global.serviceAccountName }}
      {{- end }}
      {{- if $values.schedulerName }}
      schedulerName: {{ $values.schedulerName }}
      {{- end }}
      initContainers:
        - name: wait-gcs-ready
          image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
          command: [ "/bin/bash", "-lc", "--" ]
          args:
            - |
              SECONDS=0
              while true; do
                if (( SECONDS <= 120 )); then
                  if ray health-check --address {{ include "ray-cluster.fullname" $ }}-head-svc.{{ $.Release.Namespace }}.svc.cluster.local:6379 > /dev/null 2>&1; then
                    echo "GCS is ready."
                    break
                  fi
                  echo "$SECONDS seconds elapsed: Waiting for GCS to be ready."
                else
                  if ray health-check --address {{ include "ray-cluster.fullname" $ }}-head-svc.{{ $.Release.Namespace }}.svc.cluster.local:6379; then
                    echo "GCS is ready. Any error messages above can be safely ignored."
                    break
                  fi
                  echo "$SECONDS seconds ELAPSED: Still waiting for GCS to be ready."
                fi
                sleep 0.5
              done
      containers:
        - name: frontend-executor
          image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- if $values.command }}
          command: {{- toYaml $values.command | nindent 12 }}
          {{- end }}
          {{- if $values.args }}
          args: {{- toYaml $values.args | nindent 12 }}
          {{- end }}
          env:
            {{- with $.Values.common.containerEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $values.containerEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FE_PORT
              value: "{{ $targetPort }}"
            - name: FE_SCHEME
              value: "{{ if $.Values.global.ssl.httpSslEnable }}https{{ else }}http{{ end }}"
            - name: SSL_DIR
              value: "{{ $.Values.global.ssl.sslBasePath }}"
            - name: RAY_ADDRESS
              value: "{{ include "ray-cluster.fullname" $ }}-head-svc.{{ $.Release.Namespace }}.svc.cluster.local:6379"
          ports:
            {{- range $.Values.global.network.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          volumeMounts:
            {{- if $.Values.global.scc.enable }}
            - name: scc-ks
              mountPath: {{ $.Values.global.scc.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $.Values.global.ssl.httpSslEnable }}
            - name: ssl-resource
              mountPath: {{ $.Values.global.ssl.sslBasePath }}
              readOnly: true
            {{- end }}
            - mountPath: /etc/xds/config/framework
              name: xds-framework-config-volume
            - mountPath: /opt/cloud/logs
              name: cloud-log-volume
          {{- if $values.lifecycle }}
          lifecycle: {{- toYaml $values.lifecycle | nindent 12 }}
          {{- end }}
          resources: {{- toYaml $values.resources | nindent 12 }}
          {{- if $values.livenessProbe }}
          livenessProbe:
            {{- if $.Values.global.ssl.httpSslEnable }}
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  SSL_DIR="{{ $.Values.global.ssl.sslBasePath }}"
                  CERT_PASS=$(python3 -c "from xds.config.constants import ENABLE_SENSITIVE_INFO_DECRYPT; from xds.framework.utils.scc_util import decrypt_pad; pwd=open('$SSL_DIR/cert_pwd').read().strip(); print(decrypt_pad(pwd) if ENABLE_SENSITIVE_INFO_DECRYPT else pwd)" 2>/dev/null)
                  CURL_OPTS="-sk --cert $SSL_DIR/module.crt --key $SSL_DIR/module.key"
                  if [ -n "$CERT_PASS" ]; then CURL_OPTS="$CURL_OPTS --pass $CERT_PASS"; fi
                  curl $CURL_OPTS https://localhost:{{ $targetPort }}{{ $values.livenessProbe.httpGet.path }}
            {{- else }}
            httpGet:
              path: {{ $values.livenessProbe.httpGet.path }}
              port: {{ $targetPort }}
              scheme: {{ $scheme }}
            {{- end }}
            failureThreshold: {{ $values.livenessProbe.failureThreshold | default 60 }}
            periodSeconds: {{ $values.livenessProbe.periodSeconds | default 10 }}
            successThreshold: {{ $values.livenessProbe.successThreshold | default 1 }}
            timeoutSeconds: {{ $values.livenessProbe.timeoutSeconds | default 5 }}
          {{- end }}
          {{- if $values.readinessProbe }}
          readinessProbe:
            {{- if $.Values.global.ssl.httpSslEnable }}
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  SSL_DIR="{{ $.Values.global.ssl.sslBasePath }}"
                  CERT_PASS=$(python3 -c "from xds.config.constants import ENABLE_SENSITIVE_INFO_DECRYPT; from xds.framework.utils.scc_util import decrypt_pad; pwd=open('$SSL_DIR/cert_pwd').read().strip(); print(decrypt_pad(pwd) if ENABLE_SENSITIVE_INFO_DECRYPT else pwd)" 2>/dev/null)
                  CURL_OPTS="-sk --cert $SSL_DIR/module.crt --key $SSL_DIR/module.key"
                  if [ -n "$CERT_PASS" ]; then CURL_OPTS="$CURL_OPTS --pass $CERT_PASS"; fi
                  curl $CURL_OPTS https://localhost:{{ $targetPort }}{{ $values.readinessProbe.httpGet.path }}
            {{- else }}
            httpGet:
              path: {{ $values.readinessProbe.httpGet.path }}
              port: {{ $targetPort }}
              scheme: {{ $scheme }}
            {{- end }}
            failureThreshold: {{ $values.readinessProbe.failureThreshold | default 3 }}
            periodSeconds: {{ $values.readinessProbe.periodSeconds | default 5 }}
            successThreshold: {{ $values.readinessProbe.successThreshold | default 1 }}
            timeoutSeconds: {{ $values.readinessProbe.timeoutSeconds | default 5 }}
          {{- end }}
          {{- if $values.startupProbe }}
          startupProbe:
            {{- if $.Values.global.ssl.httpSslEnable }}
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  SSL_DIR="{{ $.Values.global.ssl.sslBasePath }}"
                  CERT_PASS=$(python3 -c "from xds.config.constants import ENABLE_SENSITIVE_INFO_DECRYPT; from xds.framework.utils.scc_util import decrypt_pad; pwd=open('$SSL_DIR/cert_pwd').read().strip(); print(decrypt_pad(pwd) if ENABLE_SENSITIVE_INFO_DECRYPT else pwd)" 2>/dev/null)
                  CURL_OPTS="-sk --cert $SSL_DIR/module.crt --key $SSL_DIR/module.key"
                  if [ -n "$CERT_PASS" ]; then CURL_OPTS="$CURL_OPTS --pass $CERT_PASS"; fi
                  curl $CURL_OPTS https://localhost:{{ $targetPort }}{{ $values.startupProbe.httpGet.path }}
            {{- else }}
            httpGet:
              path: {{ $values.startupProbe.httpGet.path }}
              port: {{ $targetPort }}
              scheme: {{ $scheme }}
            {{- end }}
            failureThreshold: {{ $values.startupProbe.failureThreshold | default 60 }}
            initialDelaySeconds: {{ $values.startupProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ $values.startupProbe.periodSeconds | default 10 }}
            successThreshold: {{ $values.startupProbe.successThreshold | default 1 }}
            timeoutSeconds: {{ $values.startupProbe.timeoutSeconds | default 10 }}
          {{- end }}
      volumes:
        - name: xds-framework-config-volume
          configMap:
            name: xds-framework-config
        {{- if $.Values.global.ssl.httpSslEnable }}
        - name: ssl-resource
          secret:
            secretName: {{ $.Values.global.ssl.secretName }}
            defaultMode: 256
        {{- end }}
        {{- if $.Values.global.scc.enable }}
        - name: scc-ks
          secret:
            secretName: {{ $.Values.global.scc.secretName }}
            defaultMode: 256
        {{- else }}
        - name: scc-ks
          emptyDir: {}
        {{- end }}
        - name: cloud-log-volume
          emptyDir: {}
      affinity:
        {{- if $values.podAntiAffinity }}
        podAntiAffinity: {{- toYaml $values.podAntiAffinity | nindent 10 }}
        {{- end }}
      {{- if $values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml $values.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- if $values.tolerations }}
      tolerations: {{- toYaml $values.tolerations | nindent 8 }}
      {{- end }}
      {{- if $values.nodeSelector }}
      nodeSelector: {{- toYaml $values.nodeSelector | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- if $values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $values.terminationGracePeriodSeconds }}
      {{- else }}
      terminationGracePeriodSeconds: 2100
      {{- end }}
{{- end }}
