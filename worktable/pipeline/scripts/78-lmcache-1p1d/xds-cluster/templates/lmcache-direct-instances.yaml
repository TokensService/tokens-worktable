{{- $lmcache := .Values.lmcache | default dict }}
{{- $deploymentMode := $lmcache.deploymentMode | default .Values.deploymentMode }}
{{- $direct := $lmcache.direct | default .Values.direct | default dict }}
{{- $instancesCfg := $lmcache.directInstances | default dict }}
{{- $common := .Values.common | default dict }}
{{- $commonEnv := $common.containerEnv | default list }}
{{- $directEnv := $direct.env | default list }}
{{- $includeCommonEnv := $direct.includeCommonEnv | default false }}
{{- $baseEnv := ternary (concat $commonEnv $directEnv) $directEnv $includeCommonEnv }}
{{- $commonTolerations := $common.tolerations | default list }}
{{- $directTolerations := $direct.tolerations | default list }}
{{- $tolerations := concat $commonTolerations $directTolerations }}
{{- $diagnostics := $.Values.diagnostics | default dict }}
{{- $timingPatch := $diagnostics.timingPatch | default dict }}
{{- if and (eq $deploymentMode "direct") ($instancesCfg.enabled | default false) }}
{{- range $inst := ($instancesCfg.instances | default list) }}
{{- $server := mergeOverwrite (deepCopy ($direct.server | default dict)) ($inst.server | default dict) }}
{{- $env := concat $baseEnv ($inst.env | default list) }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $inst.name | quote }}
  namespace: {{ include "lmcache.namespace" $ | quote }}
  labels:
    app.kubernetes.io/name: lmcache
    app.kubernetes.io/instance: {{ $inst.name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lmcache
      app.kubernetes.io/instance: {{ $inst.name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lmcache
        app.kubernetes.io/instance: {{ $inst.name | quote }}
{{ toYaml ($direct.podLabels | default dict) | indent 8 }}
      {{- with $direct.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
      hostIPC: {{ $direct.hostIPC | default false }}
      hostPID: {{ $direct.hostPID | default false }}
      {{- if $direct.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ $direct.dnsPolicy | default "ClusterFirstWithHostNet" }}
      {{- end }}
      {{- with $direct.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with $direct.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $direct.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      nodeSelector:
{{ toYaml ($inst.nodeSelector | default $direct.nodeSelector) | indent 8 }}
      {{- with $tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with ($inst.affinity | default $direct.affinity) }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $direct.volumes }}
      volumes:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: lmcache-server
          image: "{{ $direct.image.repository }}:{{ $direct.image.tag }}"
          imagePullPolicy: {{ $direct.image.pullPolicy | quote }}
          {{- with $direct.securityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $env }}
          env:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- if or $direct.volumeMounts ($timingPatch.enabled | default false) }}
          volumeMounts:
          {{- with $direct.volumeMounts }}
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- end }}
          command:
            - /bin/bash
            - -lc
          args:
            - |
              {{- with $inst.cudaVisibleDevices }}
              export CUDA_VISIBLE_DEVICES={{ . | quote }}
              {{- end }}
              echo "[zcx] start lmcache instance={{ $inst.name }} port={{ $server.port }} http={{ $server.httpPort }} cuda=${CUDA_VISIBLE_DEVICES:-all}"
              python3 -m pip install --no-deps --force-reinstall /opt/lmcache-wheels/lmcache-0.5.1+ppfix1-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
              python3 - <<'PY'
              from pathlib import Path

              path = Path("/usr/local/lib/python3.12/dist-packages/lmcache/integration/vllm/lmcache_mp_connector_0180.py")
              text = path.read_text()
              old = """    return LMCacheMPSchedulerAdapter(\n        server_url,\n        zmq_context,\n"""
              new = """    return LMCacheMPSchedulerAdapter(\n        [server_url],\n        zmq_context,\n"""
              if new not in text:
                  if old not in text:
                      raise RuntimeError("LMCacheMPConnector scheduler server_url patch marker not found")
                  path.write_text(text.replace(old, new, 1))
              print("LMCacheMPSchedulerAdapter server_url list compatibility applied")
              PY
              python3 /opt/lmcache-patches/patch_lmcache_register_busy_tracking.py
              python3 /opt/lmcache-patches/patch_lmcache_mooncake_mq_busy_gate.py
              set -- \
                --host {{ $server.host }} \
                --port {{ $server.port }} \
                --http-host {{ $server.httpHost }} \
                --http-port {{ $server.httpPort }} \
                --l1-init-size-gb {{ $server.l1InitSizeGB }} \
                --l1-size-gb {{ $server.l1SizeGB }} \
                --l1-align-bytes {{ $server.l1AlignBytes }} \
                --chunk-size {{ $server.chunkSize }} \
                --max-workers {{ $server.maxWorkers }} \
                {{- if $server.enableTracing }}
                --enable-tracing \
                --otlp-endpoint {{ $server.otlpEndpoint }} \
                {{- end }}
                --eviction-policy {{ $server.evictionPolicy }} \
                --l2-store-policy {{ $server.l2StorePolicy }}
              {{- if and $server.maxGpuWorkers (ne (toString $server.maxGpuWorkers) "null") }}
              set -- "$@" --max-gpu-workers {{ $server.maxGpuWorkers }}
              {{- end }}
              {{- if and $server.maxCpuWorkers (ne (toString $server.maxCpuWorkers) "null") }}
              set -- "$@" --max-cpu-workers {{ $server.maxCpuWorkers }}
              {{- end }}
              {{- if not $server.l1UseLazy }}
              set -- "$@" --no-l1-use-lazy
              {{- end }}
              {{- range $server.l2Adapters }}
              l2_adapter='{{ toJson . }}'
              echo "[zcx] node=${K8S_NODE_NAME:-unknown} instance={{ $inst.name }} lmcache l2 adapter=${l2_adapter}"
              set -- "$@" --l2-adapter "${l2_adapter}"
              {{- end }}
              exec lmcache server "$@"
          ports:
            - name: zmq
              containerPort: {{ $server.port }}
              protocol: TCP
            - name: http
              containerPort: {{ $server.httpPort }}
              protocol: TCP
          {{- with ($inst.resources | default $direct.resources) }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
{{- end }}
{{- end }}
