common:
  containerEnv:
    - name: RAY_min_memory_free_bytes
      value: '5368709120'
    - name: RAY_SERVE_CONTROL_LOOP_INTERVAL_S
      value: '10'
    - name: RAY_gcs_rpc_server_reconnect_timeout_s
      value: '1209600'
    - name: RAY_gcs_rpc_server_connect_timeout_s
      value: '10'
    - name: RAY_maximum_gcs_destroyed_actor_cached_count
      value: '2000'
    - name: MC_USE_TENT
      value: '1'
    - name: MC_TENT_CONF
      value: '{"topology":{"rdma_whitelist":["mlx5_bond_1","mlx5_bond_2","mlx5_bond_3","mlx5_bond_4","mlx5_bond_5","mlx5_bond_6","mlx5_bond_7","mlx5_bond_8"],"rdma_blacklist":[]},"transports":{"nvlink":{"enable":false},"rdma":{"enable":true,"device":{"gid_index":3},"workers":{"max_retry_count":64}}}}'
    - name: XDS_COMMON_CONFIGMAP_FILE
      value: /etc/xds/config/common/xds_common.conf
    - name: XDS_FRAMEWORK_CONFIGMAP_FILE
      value: /etc/xds/config/framework/xds_framework.conf
    - name: XDS_JOB_EXECUTION_CONFIGMAP_FILE
      value: /etc/xds/config/framework/job_execution_config.json
    - name: RAY_ROTATION_MAX_BYTES
      value: '104857600'
    - name: RAY_ROTATION_BACKUP_COUNT
      value: '10'
    - name: RAY_num_server_call_thread
      value: '1'
    - name: RAY_DEDUP_LOGS
      value: '0'
    - name: INF_NAN_MODE_ENABLE
      value: '0'
    - name: INF_NAN_MODE_FORCE_DISABLE
      value: '1'
    - name: NUMEXPR_MAX_THREADS
      value: '16'
    - name: RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES
      value: '1'
    - name: ENABLE_MYSQL_ENCRYPT
      value: 'false'
    - name: EMS_SDK_LOG
      value: /tmp/ems
    - name: EMS_ENABLE_SEPARATE_THREAD_POOL
      value: '1'
    - name: EMS_MAIN_LOAD_THREAD_SIZE
      value: '2'
    - name: EMS_MAIN_SAVE_THREAD_SIZE
      value: '24'
    - name: EMS_MID_REQ_QUEUE_NUM
      value: '1'
    - name: EMS_MAX_TASK_NUM_PER_QUEUE
      value: '8196'
    - name: ENABLE_MKI_LOG
      value: '1'
    - name: VLLM_MQ_MAX_CHUNKS
      value: '20'
    - name: VLLM_GC_ENABLED
      value: '1'
    - name: VLLM_GC_CHECK_INTERVAL
      value: '400'
    - name: VLLM_GC_THRESHOLD
      value: '0.95'
    - name: VLLM_GC_EMERGENCY_THRESHOLD
      value: '0.97'
    - name: XCCL_TURBO_PREFILL_MLA_HEAD_PADDING
      value: '64'
    - name: XCCL_TURBO_FIX_PP_WEIGHT_LOAD
      value: '1'
    - name: VLLM_RAY_EXTRA_ENV_VAR_PREFIXES_TO_COPY
      value: "XCCL_TURBO_ENABLE_GLM52_INDEXCACHE,XCCL_TURBO_GLM52_INDEXCACHE_STRICT_PP,
      XCCL_TURBO_GLM52_INDEXCACHE_FORCE_MTP_SHARE,XCCL_TURBO_SYNC_SPARSE_INDEXER, XCCL_TURBO_FIX_NATIVE_CPU_OFFLOAD_PIN"
    - name: CUDA_ENABLE_COREDUMP_ON_EXCEPTION
      value: '1'
    - name: CUDA_COREDUMP_SHOW_PROGRESS
      value: '1'
    - name: CUDA_COREDUMP_GENERATION_FLAGS
      value: 'skip_nonrelocated_elf_images,skip_global_memory,skip_shared_memory,skip_local_memory,skip_constbank_memory'
    - name: CUDA_COREDUMP_FILE
      value: '/home/service/works/models_ssd/wwx/cuda_coredump_%h.%p.%t'
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: K8S_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: XDS_DATABASE_TYPE
      value: 'mysql'
    - name: XDS_DATABASE_NAME
      value: "XDS_DATABASE_NAME"
    - name: XDS_DATABASE_HOST
      value: "XDS_DATABASE_HOST"
    - name: XDS_DATABASE_PORT
      value: "3306"
    - name: XDS_DATABASE_USERNAME
      value: "XDS_DATABASE_USERNAME"
    - name: XDS_DATABASE_PASSWORD
      value: "XDS_DATABASE_PASSWORD"
    - name: TASK_QUEUE_ENABLE
      value: '2'
    - name: PLOG_SRC_DIR
      value: /home/service/log
    - name: PLOG_DEST_DIR
      value: /home/service/works/models_ssd/plog
    - name: XDS_NAMESPACE
      value: xds-zcx-lmcache-78-glm52-mg39-1p1d-gdr
    - name: XDS_TE_POD_LABEL_KEY
      value: kubernetes.io/hostname
    - name: XDS_TE_POD_LABEL_VAL
      value: 192.168.0.78
  tolerations:
    - effect: NoExecute
      key: node.kubernetes.io/not-ready
      operator: Exists
      tolerationSeconds: 60
    - effect: NoExecute
      key: node.kubernetes.io/unreachable
      operator: Exists
      tolerationSeconds: 60

commonConfigFiles:
  xds_common.conf: |
    [log]
    log_path = /tmp/xds/log/ # override notice
    log_level = INFO
    [feature]
    npu_fork = true

frameworkConfigFiles:
  xds_framework.conf: |
    [charging_log]
    charging_log_dir = /tmp/xds-charging-log/
    [metric]
    pushgateway = true
    collector_gateway_url = 192.168.10.6:25888
    latency_metric_interval = 1
    executor_metric_interval = 1
    metrics_ssl_auth = false
    [model]
    model_cache_dir = /home/service/works/models_ssd
    local_model_dir = /home/service/works/models_ssd
    [deploy]
    actor_max_concurrency = 20000
    grpc_channel_count = 4
    separate_deploy = true
    serve_proxy_use_pod_ip = true
    k8s_deploy_namespace = xds-zcx-lmcache-78-glm52-mg39-1p1d-gdr
    task_executor_max_init_time = 4800 # 首次部署的时候设置拉起TE的最大超时时间, 单位s
    [scale]
    executor_scale_interval = 1
    auto_scale = true
    enable_scale_in = true
    scale_in_uptime = 600
    scale_in_stalled_request_limit = 10
    scale_in_hard_limit_seconds = 2100
    scale_in_period_min = 10 # 缩容周期
    dte_rest_wait_seconds = 120 # DTE rest 阶段等待时间
    scale_in_window_step = 3
    scale_in_min_window = 3
    [fe]
    min_frontend_num = 3 # 对应修改frontGroup minReplicas
    max_frontend_num = 3 # 对应修改frontGroup maxReplicas
    graceful_shutdown_timeout_s = 2100
    force_restart_threshold_s = 2100
    max_proxy_actor_draining_time = 2100
    min_requests_to_kill = 2
    [health_check]
    fetch_runtime_info_timeout = 30
    [feature]
    ak_str = str
    sk_str = str
    project_id = str
    region_id = str
    sendalarm_to_aom = false
    alarm_resource_provider = AIDataLake
    [je_scheduler_sub_health_aware_policy]
    enable_je_scheduler_sub_health_aware_policy = true
    [prefix_match_schedule_policy]
    use_je_prefix_match_strategy = false
    prefix_match_strategy = prompt # prompt|tenant, 其中prompt表示按照输入内容进行亲和性调度，tenant表示按照租户id进行亲和性调度
    prefix_match_balance_abs_threshold = 0
    [limit]
    concurrency_limit_threshold = 18000
    [Mock]
    mock_db = true
    only_je = false
    mock_prefill_te = false
    mock_decode_te = false
    mock_prefill_te_latency_ms = 0.0
    mock_decode_te_latency_ms = 0.0
    [XDS_JE_CPP]
    xds_je_cpp_install_dir = /usr/local/xds_cpp
    xds_je_cpp_conf_path = /etc/xds/config/xds_cpp/conf/xds_je_server.config
    je_heartbeat_posix = /je_heartbeat_cpp_to_py
    je_heartbeat_retry_times = 3 # JE心跳失败连续重试次数
    je_heartbeat_retry_timeout_s = 10 # JE心跳单次超时时间
    [XDS_LME_CPP]
    xds_lme_cpp_install_dir = /usr/local/xds_cpp
    xds_lme_cpp_conf_path = /etc/xds/config/xds_cpp/conf/xds_lme_server.config
    lme_heartbeat_posix = /lme_heartbeat_cpp_to_py
    lme_data_upload_posix = /lme_data_upload_cpp_to_py
    lme_heartbeat_retry_times = 3 # LME心跳失败连续重试次数
    lme_heartbeat_retry_timeout_s = 10 # LME心跳单次超时时间
    [XDS_DPS_CPP]
    xds_dps_cpp_install_dir = /usr/local/xds_cpp
    xds_dps_cpp_conf_path = /etc/xds/config/xds_cpp/conf/xds_dps_server.config
    dps_heartbeat_posix = /dps_heartbeat_cpp_to_py
    dps_heartbeat_retry_times = 3 # DPS心跳失败连续重试次数
    dps_heartbeat_retry_timeout_s = 10 # DPS心跳单次超时时间
    [RAS]
    te_load_strategy_type = SingleXpodSingleModel
    prefill_num_priority = false
    npu_label_only = true
    [je_reconstruct]
    use_prefill_batch_schedule = true # je c++重构开关，prefill是否使用batch调度
    [framework]
    xds_framework_v2 = true
    [kv_transfer]
    kv_transfer_in_node_link_type = SDMA
    kv_transfer_cross_node_link_type = TCP
    [ems_config]
    ems_enable = false
    ems_namespace = ems_deploy_ns
    ems_cluster_id = 00000000-0000-0000-0000-000000000000
    [device]
    compute_device = gpu

  job_execution_config.json: |
    {
      "job_executor_groups": [
        {
          "type": "chat_completion",
          "min_executors": 2,
          "max_executors": 2,
          "resources": {
            "CPU": 24.0,
            "GPU": 0,
            "NPU": 0
          }
        }
      ]
    }
XDSCppServerConfigFile:
  xds_je_server.config: |
    {
      "server": {
        "port": 50051,
        "host": "0.0.0.0",
        "max_concurrent_requests": 100,
        "tokenizer_queue_capacity": 100000,
        "tokenizer_max_tasks": 20,
        "schedule_strategy_queue_capacity": 100000,
        "schedule_strategy_max_tasks": 10,
        "schedule_queue_capacity": 100000,
        "schedule_max_tasks": 10,
        "post_queue_capacity": 100000,
        "post_max_tasks": 10,
        "pending_dispatch_queue_capacity": 100000,
        "pending_dispatch_max_tasks": 10,
        "grpc_je_to_ts_deadline_second": 20,
        "grpc_je_to_pte_deadline_second": 7200,
        "je_ttft_check_interval_us": 1000
      },
      "model": {
        "model_dir": "/home/service/works/models_ssd/",
        "jinja_dir": "/usr/local/lib/python3.12/dist-packages/vllm_xds_engine/entrypoints/templates/",
        "tokenizer_mode": "auto",
        "tokenizer_revision": "None",
        "disagg_pd_deploy_prefill_tp_size": 8,
        "scheduler_mode": "local"
      },
      "logging": {
        "level": "INFO",
        "log_file": "/tmp/xds/xds_cpp_je.log"
      },
      "heartbeat": {
        "processor_heartbeat_interval_ms": 500,
        "processor_heartbeat_timeout_ms": 30000,
