global:
  annotations:
    ray.io/external-storage-namespace: my-raycluster-storage
    ray.io/ft-enabled: "true"
    ray.io/overwrite-container-cmd: "true"
  enableAutomountServiceAccountToken: true
  restartPolicy:
    head: OnFailure
    worker: OnFailure
  fullnameOverride: ""
  imagePullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: default-secret
  imageRegistry: swr.cn-southwest-2.myhuaweicloud.com/dataartsfabric
  images:
    ray: xds:0630_dev_bnt3.20260731104632.BNT3.x86_64
  nameOverride: kuberay
  namespace: xds-zcx-lmcache-78-glm52-mg39-1p1d-gdr
  network:
    # elbId: {ELB_ID}
    ports:
      - name: frontend-port
        port: 30069 # Service 监听的端口
        protocol: TCP
        targetPort: 8000
        nodePort: 30079  # 范围是 30000 - 32767
  redis:
    redisEnable: false
    redisSslEnable: false
  scc:
    enable: false
  service:
    svcName: ray-svc
  ssl:
    grpcSslEnable: false
    httpSslEnable: false
  storage:
    hostPath: /mnt/paas
    mountPath: /home/service/works/models_ssd
    # pv:
    #   pvName: {PV_NAME}
    #   shareLocation: {SFS_SHARE_LOCATION}
    #   volumeHandle: {SFS_VOLUMEHANDLE}
    # pvc:
    #   pvcName: {PVC_NAME}
    #   pvcResPolicy: keep
    #   storage: 100Gi
    # storageClass: "csi-sfsturbo"
    # container:
    #   mountPath: {SFS_MOUNT_PATH}
  roleName: xds-zcx-lmcache-78-glm52-mg39-1p1d-gdr-role
  roleBindingName: xds-zcx-lmcache-78-glm52-mg39-1p1d-gdr-role-binding
  serviceAccountName: xds-zcx-lmcache-78-glm52-mg39-1p1d-gdr-sa
  serviceAccountSecretName: xds-zcx-lmcache-78-glm52-mg39-1p1d-gdr-sa-secret
  enableTaskExecutorGroups: true
  taskExecutorGroupType: "card"
head:
  annotations: {}
  args:
   - >-
     source /home/service/.bashrc;
     ulimit -n 65536;
     source /usr/local/xds_cpp/script/setenv.bash;
     sh /home/service/prelaunch/clear_log.sh &
     (for i in {1..20}; do echo "wait $i s"; sleep 1; done;
     ray status; python3 /home/service/prelaunch/check_work_pod_status.py; xds --port 8000 --host 0.0.0.0 --route-prefix=/xds/v1) &
     $(KUBERAY_GEN_RAY_START_CMD)
  command:
    - /bin/bash
    - -lc
    - --
  containerEnv:
    # - name: RAY_REDIS_ADDRESS
    #   value: {RAY_REDIS_ADDRESS}
    - name: RAY_redis_db_connect_retries
      value: '300'
    - name: RAY_redis_db_connect_wait_milliseconds
      value: '1000'
    - name: RAY_health_check_failure_threshold
      value: '60'
    - name: RAY_health_check_period_ms
      value: '5000'
    - name: RAY_SERVE_PROXY_HEALTH_CHECK_TIMEOUT_S
      value: '90'
    - name: RAY_SERVE_PROXY_READY_CHECK_TIMEOUT_S
      value: '90'
    - name: RAY_SERVE_PROXY_HEALTH_CHECK_PERIOD_S
      value: '120'
    - name: RAY_grpc_client_keepalive_timeout_ms
      value: '300000'
  enableInTreeAutoscaling: true
  envFrom: []
  # headService:
  #   metadata:
  #     annotations:
  #       kubernetes.io/elb.class: performance
  #       kubernetes.io/elb.health-check-flag: 'on'
  #       kubernetes.io/elb.health-check-option: '{"protocol":"TCP","delay":"5","timeout":"10","max_retries":"3"}'
  #       kubernetes.io/elb.id: {ELB_ID}
  #       kubernetes.io/elb.keepalive_timeout: '1000'
  #       kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
  #     labels:
  #       app.kubernetes.io/name: ray
  #     name: ray-head-svc
  #     namespace: xds-zcx-lmcache-78-glm52-mg39-1p1d-gdr
  labels: {}
  livenessProbe:
    exec:
      command:
        - bash
        - '-c'
        - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success && wget -T 2 -q -O- http://$POD_IP:8265/api/gcs_healthz | grep success
    failureThreshold: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  nodeSelector:
    kubernetes.io/hostname: 192.168.0.78
  ports:
    - containerPort: 6379
      name: gcs
    - containerPort: 8265
      name: dashboard
    - containerPort: 10001
      name: client
    - containerPort: 44217
      name: as-metrics
    - containerPort: 44227
      name: dash-metrics
  rayStartParams:
    system-config: '"{\"gcs_server_rpc_server_thread_num\": 32, \"gcs_server_rpc_client_thread_num\": 32}"'
    dashboard-agent-grpc-port: 10013
    dashboard-agent-listen-port: 52365
    dashboard-host: $POD_IP
    dashboard-port: 8265
    max-worker-port: 19999
    metrics-export-port: 10014
    min-worker-port: 10020
    node-manager-port: 10010
    num-cpus: 0
    object-manager-port: 10011
    port: 6379
    ray-client-server-port: 10001
    # redis-password: {REDIS_PASSWORD}
    redis-shard-ports: 10002
    runtime-env-agent-port: 10012
  rayVersion: 2.34.0
  readinessProbe:
    exec:
      command:
        - bash
        - '-c'
        - timeout 10 bash -c "/bin/bash /opt/xds/script/check_net_connect.sh" || true && wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success && wget -T 2 -q -O- http://$POD_IP:8265/api/gcs_healthz | grep success
    failureThreshold: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 20
  startupProbe:
    exec:
      command:
        - bash
        - '-c'
        - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success
    failureThreshold: 60
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  resources:
    limits:
      cpu: '12'
      memory: 32G
    requests:
      cpu: '12'
      memory: 32G
  securityContext:
    privileged: true
    runAsGroup: 1000
    runAsUser: 1000
    capabilities:
      add: ["NET_ADMIN"]
    seccompProfile:
      type: RuntimeDefault
  sidecarContainers: []
