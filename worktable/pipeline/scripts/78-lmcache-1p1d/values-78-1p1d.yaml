        "ts_queue_size_per_te": 2,
        "ts_ttft_timeout_second": 180,
        "estimator_offline_update_mode": true,
        "batching_strategy": "TOKEN_DEV_TE",
        "grpc_timeout_seconds": 5,
        "ts_dte_select_strategy": "CACHE_AWARE",
        "hyper_node_kv_cache_util_threshold": 0.0,
        "hyper_node_batchsize_util_threshold": 0.0,
        "ts_ems_enable_block_num_lower_bound": 20,
        "ts_kv_block_size": 128,
        "ts_not_sp_req_wait_time_threshold": 0.0
      },
      "te_type": {
        "tp4_dp2": {
          "ts_batch_token_num_limit_per_dp": 6144,
          "ts_dp_num_per_te": 2,
          "ts_batch_size_per_dp": 64,
          "ts_batching_timeout_strategy": "LIMIT",
          "ts_batching_timeout_on_request": 0.1,
          "ts_waiting_pte_batch_time": 0.2,
          "theoretical_tps": 1750,
          "theoretical_qps_per_pte":200,
          "ts_not_sp_req_wait_num_threshold": -2
        },
        "tp4_dp4": {
          "ts_batch_token_num_limit_per_dp": 6144,
          "ts_dp_num_per_te": 4,
          "ts_batch_size_per_dp": 64,
          "ts_batching_timeout_strategy": "LIMIT",
          "ts_batching_timeout_on_request": 0.1,
          "ts_waiting_pte_batch_time": 0.6,
          "theoretical_tps": 1750,
          "theoretical_qps_per_pte":200,
          "ts_not_sp_req_wait_num_threshold": -2
        },
        "tp4_dp8": {
          "ts_batch_token_num_limit_per_dp": 6144,
          "ts_dp_num_per_te": 8,
          "ts_batch_size_per_dp": 64,
          "ts_batching_timeout_strategy": "LIMIT",
          "ts_batching_timeout_on_request": 0.1,
          "ts_waiting_pte_batch_time": 0.6,
          "theoretical_tps": 1750,
          "theoretical_qps_per_pte":200,
          "ts_not_sp_req_wait_num_threshold": -2
        },
        "tp8_dp4": {
          "ts_batch_token_num_limit_per_dp": 32768,
          "ts_dp_num_per_te": 4,
          "ts_batch_size_per_dp": 64,
          "ts_batching_timeout_strategy": "SMART_V1",
          "ts_batching_timeout_on_request": 0.1,
          "ts_waiting_pte_batch_time": 0.2,
          "theoretical_tps": 1180,
          "theoretical_qps_per_pte":200,
          "ts_not_sp_req_wait_num_threshold": -2
        },
        "tp16_dp2": {
          "ts_batch_token_num_limit_per_dp": 32768,
          "ts_dp_num_per_te": 2,
          "ts_batch_size_per_dp": 64,
          "ts_batching_timeout_strategy": "SMART_V1",
          "ts_batching_timeout_on_request": 0.1,
          "ts_waiting_pte_batch_time": 0.2,
          "theoretical_tps": 0,
          "theoretical_qps_per_pte":200,
          "ts_not_sp_req_wait_num_threshold": -2
        }
      },
      "logging": {
        "level": "INFO",
        "log_file": "/tmp/xds/xds_cpp_lme.log"
      },
      "heartbeat": {
        "processor_heartbeat_interval_ms": 500,
        "processor_heartbeat_timeout_ms": 30000,
        "heartbeat_manager_log_interval_ms": 10000,
        "heartbeat_manager_report_interval_ms": 500,
        "heartbeat_manager_report_timeout_ms": 300000
      },
      "metrics": {
        "push_interval_s": 15
      }
    }
  xds_dps_server.config: |
    {
      "server": {
        "rpc_thread_nums": 4,
        "dps_sender_thread_nums": 4,
        "grpc_dps_to_multiend_deadline_second": 7200,
        "dps_publish_to_ts_interval_ms": 100
      },
      "logging": {
        "level": "INFO",
        "log_file": "/tmp/xds/xds_cpp_dps.log"
      },
      "heartbeat": {
        "processor_heartbeat_interval_ms": 500,
        "processor_heartbeat_timeout_ms": 30000,
        "heartbeat_manager_log_interval_ms": 10000,
        "heartbeat_manager_report_interval_ms":  500
      },
      "metrics": {
        "pushgateway_enabled": false,
        "collector_gateway_url": "$192.168.10.6:25888",
        "tls_enabled": false,
        "tls_path": "/home/service/resource/ssl/",
