apiVersion: ray.io/v1
kind: RayCluster
metadata:
  labels:
{{ include "ray-cluster.labels" . | indent 4 }}
  name: {{ include "ray-cluster.fullname" . }}
  {{ if .Values.global.annotations }}
  annotations: {{ toYaml .Values.global.annotations | nindent 4 }}
  {{ end }}
spec:
  {{- if .Values.head.rayVersion }}
  rayVersion: {{ .Values.head.rayVersion }}
  {{- end }}
  {{- if .Values.head.enableInTreeAutoscaling }}
  enableInTreeAutoscaling: {{ .Values.head.enableInTreeAutoscaling }}
  {{- end }}
  autoscalerOptions:
    envFrom: [ ]
    env:
      {{- if $.Values.global.ssl.grpcSslEnable}}
      - name: RAY_USE_TLS
        value: "1"
      - name: RAY_TLS_SERVER_CERT
        value: "/etc/ray/tls/tls.crt"
      - name: RAY_TLS_SERVER_KEY
        value: "/etc/ray/tls/tls.key"
      - name: RAY_TLS_CA_CERT
        value: "/etc/ca/tls/ca.crt"
      - name: RAY_TLS_SERVER_KEY_PASSWORD_ENABLE
        value: 'true'
      - name: RAY_TLS_SERVER_KEY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: ca-tls
            key: server_key_password
      {{- end}}
      - name: ENV_SCC_CONF
        value: "/opt/cloud/scc/scc.conf"
      - name: RAY_TMPDIR
        value: "/opt/cloud/logs"
    idleTimeoutSeconds: 60
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: '1'
        memory: 1Gi
    {{- if or $.Values.global.ssl.grpcSslEnable $.Values.global.scc.enable }}
    volumeMounts:
      {{- if $.Values.global.ssl.grpcSslEnable}}
      - mountPath: /etc/ca/tls
        name: ca-tls
      - mountPath: /etc/ray/tls
        name: ray-tls
      {{- end}}
      {{- if $.Values.global.scc.enable}}
      - name: scc-ks
        mountPath: {{ $.Values.global.scc.mountPath }}
        readOnly: true
      {{- end}}
    {{- end}}
    securityContext: { }
    upscalingMode: Default
  headGroupSpec:
    {{- if .Values.head.headService }}
    headService: {{- toYaml .Values.head.headService | nindent 6 }}
    {{- end }}
    {{- if .Values.head.type }}
    serviceType: {{ .Values.head.type }}
    {{- end }}
    rayStartParams:
    {{- if and (not .Values.head.rayStartParams) (not .Values.head.initArgs) }}
      {}
    {{- else }}
      {{- range $key, $val := .Values.head.rayStartParams }}
        {{ $key }}: {{ $val | quote }}
      {{- end }}
      {{- /*
      initArgs is a deprecated alias for rayStartParams.
      */}}
      {{- range $key, $val := .Values.head.initArgs }}
        {{ $key }}: {{ $val | quote }}
      {{- end }}
    {{- end }}
    template:
      spec:
        restartPolicy: {{ $.Values.global.restartPolicy.head }}
        imagePullSecrets: {{- toYaml $.Values.global.imagePullSecrets | nindent 10 }}
        {{- if .Values.global.serviceAccountName }}
        serviceAccountName: {{ .Values.global.serviceAccountName }}
        {{- end }}
        {{- if .Values.global.ssl.grpcSslEnable }}
        initContainers:
          - name: ray-head-tls
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            command: [ "/bin/sh", "-c", "cp -R /etc/ca/tls /etc/ray && /etc/gen/tls/gencert_head.sh" ]
            volumeMounts:
              - mountPath: /etc/ca/tls
                name: ca-tls
                readOnly: true
              - mountPath: /etc/ray/tls
                name: ray-tls
              - mountPath: /etc/gen/tls
                name: gen-tls-script
            {{- if or $.Values.global.scc.enable }}
              - name: scc-ks
                mountPath: {{ $.Values.global.scc.mountPath }}
                readOnly: true
            {{- end}}
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
        {{- end }}
        containers:
          - name: ray-head
            volumeMounts:
            {{- if .Values.head.volumeMounts }}
            {{- toYaml .Values.head.volumeMounts | nindent 14 }}
            {{- end}}
            {{- if or $.Values.global.scc.enable }}
              - name: scc-ks
                mountPath: {{ $.Values.global.scc.mountPath }}
                readOnly: true
            {{- end }}
            {{- if $.Values.global.ssl.httpSslEnable }}
              - name: ssl-resource
                mountPath: {{ .Values.global.ssl.sslBasePath }}
                readOnly: true
            {{- end}}
              {{- if .Values.global.ssl.grpcSslEnable}}
              - mountPath: /etc/ca/tls
                name: ca-tls
                readOnly: true
              - mountPath: /etc/ray/tls
                name: ray-tls
              - mountPath: /etc/gen/tls
                name: gen-tls-script
              {{- end}}
              {{- if $.Values.global.redis.redisSslEnable}}
              - mountPath: /home/service/redis
                readOnly: true
                name: {{ $.Values.global.redis.redisCaName }}
              {{- end}}
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
            {{- if .Values.head.livenessProbe }}
            livenessProbe:
            {{- toYaml .Values.head.livenessProbe | nindent 14 }}
            {{- end}}
            {{- if .Values.head.readinessProbe }}
            readinessProbe:
            {{- toYaml .Values.head.readinessProbe | nindent 14 }}
            {{- end}}
            {{- if .Values.head.startupProbe }}
            startupProbe:
            {{- toYaml .Values.head.startupProbe | nindent 14 }}
            {{- end}}
            resources: {{- toYaml .Values.head.resources | nindent 14 }}
            securityContext:
            {{- toYaml .Values.head.securityContext | nindent 14 }}
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            {{- with .Values.common.containerEnv }}
            {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.head.containerEnv }}
            {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- if $.Values.global.redis.redisEnable}}
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: {{ $.Values.global.redis.redisPadName }}
            {{- end}}
              - name: ENV_SCC_CONF
                value: "/opt/cloud/scc/scc.conf"
            {{- if $.Values.global.ssl.grpcSslEnable}}
              - name: RAY_USE_TLS
                value: "1"
              - name: RAY_TLS_SERVER_CERT
                value: "/etc/ray/tls/tls.crt"
              - name: RAY_TLS_SERVER_KEY
                value: "/etc/ray/tls/tls.key"
              - name: RAY_TLS_CA_CERT
                value: "/etc/ca/tls/ca.crt"
              - name: RAY_TLS_CIPHER
                value: {{ $.Values.global.ssl.tlsCipher }}
              - name: GRPC_SSL_CIPHER_SUITES
                value: {{ $.Values.global.ssl.tlsCipher }}
              - name: RAY_TLS_SERVER_KEY_PASSWORD_ENABLE
                value: 'true'
              - name: RAY_TLS_SERVER_KEY_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ca-tls
                    key: server_key_password
            {{- end}}
            {{- with .Values.head.envFrom }}
            envFrom: {{- toYaml . | nindent 14}}
            {{- end }}
            {{- if .Values.head.ports }}
            ports: {{- toYaml .Values.head.ports | nindent 14}}
            {{- end }}
            {{- if .Values.head.lifecycle }}
            lifecycle:
            {{- toYaml .Values.head.lifecycle | nindent 14 }}
            {{- end }}
            {{- if .Values.head.command }}
            command: {{- toYaml .Values.head.command | nindent 14}}
            {{- end }}
            {{- if .Values.head.args }}
            args: {{- toYaml .Values.head.args | nindent 14}}
            {{- end }}
          {{- if .Values.head.sidecarContainers }}
          {{- toYaml .Values.head.sidecarContainers | nindent 10 }}
          {{- end }}
        volumes:
          {{- if .Values.head.volumes }}
          {{- toYaml .Values.head.volumes | nindent 10 }}
          {{- end}}
          {{- if .Values.global.scc.enable }}
          - name: scc-ks
            secret:
              secretName: {{ required "primary key for scc decrypt is required" .Values.global.scc.secretName }}
              defaultMode: 256
          {{- else }}
          - name: scc-ks
            emptyDir: { }
          {{- end }}
          {{- if .Values.global.ssl.httpSslEnable }}
          - name: ssl-resource
            secret:
              secretName: {{ required "primary key for ssl resource is required" .Values.global.ssl.secretName }}
              defaultMode: 256
          {{- end }}
          {{- if $.Values.global.ssl.grpcSslEnable}}
          - name: ca-tls
            secret:
              secretName: ca-tls
          - name: ray-tls
            emptyDir: { }
          - name: gen-tls-script
            configMap:
              name: tls
              defaultMode: 511
              items:
                - key: gencert_head.sh
                  path: gencert_head.sh
          {{- end}}
          {{- if $.Values.global.redis.redisSslEnable}}
          - name: {{ $.Values.global.redis.redisCaName }}
            secret:
              secretName: {{ $.Values.global.redis.redisCaName }}
              defaultMode: 416
          {{- end}}
        affinity:
          {{- if .Values.head.podAntiAffinity }}
          podAntiAffinity: {{- toYaml .Values.head.podAntiAffinity | nindent 12 }}
          {{- end }}
          {{- if .Values.head.nodeAffinity }}
          nodeAffinity: {{- toYaml .Values.head.nodeAffinity | nindent 12 }}
          {{- end }}
        {{- if .Values.head.tolerations }}
        tolerations: {{- toYaml .Values.head.tolerations | nindent 10 }}
        {{- else if $.Values.common.tolerations }}
        tolerations: {{- toYaml $.Values.common.tolerations | nindent 10 }}
        {{- end }}
        terminationGracePeriodSeconds: 0
        nodeSelector: {{- toYaml .Values.head.nodeSelector | nindent 10 }}
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
          seccompProfile:
            type: RuntimeDefault
      metadata:
        annotations: {{- toYaml .Values.head.annotations | nindent 10 }}
        {{- if .Values.head.labels }}
        labels: {{- toYaml .Values.head.labels | nindent 10 }}
{{ include "ray-cluster.labels" . | indent 10 }}
        {{ else }}
        labels: {{ include "ray-cluster.labels" . | nindent 10 }}
        {{- end }}

  workerGroupSpecs:
  {{- range $groupName, $values := .Values.workerGroups }}
  {{- if and (eq $groupName "taskExecutorGroup-card") (eq $.Values.global.enableTaskExecutorGroups true) (eq $.Values.global.taskExecutorGroupType "card") }}
  {{- /* [Card分支] enableTaskExecutorGroups=true + taskExecutorGroupType="card"：按卡分配TE，遍历taskExecutorGroups渲染多个workerGroupSpec，支持6项覆盖机制 */}}
  {{- range $index, $teGroupValues := $.Values.taskExecutorGroups }}
  {{- /* LMCache runs inside the Prefill TE pod.  The ordinal prevents a host-network
        port conflict when more than one Prefill group lands on the same node. */}}
  {{- $lmcache := $.Values.lmcacheSidecar | default dict }}
  {{- $isLmcachePrefill := and ($lmcache.enabled | default false) (contains "prefill" (lower $teGroupValues.name)) }}
  {{- $lmcacheOrdinalText := regexFind "[0-9]+$" $teGroupValues.name }}
  {{- if and $isLmcachePrefill (eq $lmcacheOrdinalText "") }}
  {{- fail (printf "LMCache Prefill group must end with an ordinal: %s" $teGroupValues.name) }}
  {{- end }}
  {{- $lmcacheOrdinal := int $lmcacheOrdinalText }}
  {{- $lmcacheMpPort := add (int $lmcache.mpPortBase) (sub $lmcacheOrdinal 1) }}
  {{- $lmcacheHttpPort := add (int $lmcache.httpPortBase) (sub $lmcacheOrdinal 1) }}
  - rayStartParams:
    {{- if and (not $values.rayStartParams) (not $values.initArgs) }}
      {}
    {{- else }}
      {{- range $key, $val := $values.rayStartParams }}
        {{- if eq $key "resources" }}
        {{ $key }}: {{ $teGroupValues.resources | quote }}
        {{- else if and $teGroupValues.rayStartParamsPorts (hasKey $teGroupValues.rayStartParamsPorts $key) }}
        {{- /* rayStartParams port 由 taskExecutorGroups.rayStartParamsPorts 预设值填充 */}}
        {{ $key }}: {{ index $teGroupValues.rayStartParamsPorts $key | quote }}
        {{- else }}
        {{ $key }}: {{ $val | quote }}
        {{- end }}
      {{- end }}
      {{- /*
      initArgs is a deprecated alias for rayStartParams.
      */}}
      {{- range $key, $val := $values.initArgs }}
        {{ $key }}: {{ $val | quote }}
      {{- end }}
    {{- end }}
    replicas: {{ $teGroupValues.replicas | default $values.replicas }}
    minReplicas: {{ $teGroupValues.replicas | default $values.minReplicas | default 0 }}
    maxReplicas: {{ $teGroupValues.replicas | default $values.maxReplicas | default 2147483647 }}
    numOfHosts: {{ $values.numOfHosts | default 1 }}
    groupName: {{ $teGroupValues.name }}
    template:
      spec:
        restartPolicy: {{ $.Values.global.restartPolicy.worker }}
        {{- if contains "decode" (lower $teGroupValues.name) }}
        priorityClassName: io-priority-1
        {{- else if contains "prefill" (lower $teGroupValues.name) }}
        priorityClassName: io-priority-3
        {{- end }}
        automountServiceAccountToken: {{ $.Values.global.enableAutomountServiceAccountToken }}
        imagePullSecrets: {{- toYaml $.Values.global.imagePullSecrets | nindent 10 }}
        {{- if $.Values.global.serviceAccountName }}
        serviceAccountName: {{ $.Values.global.serviceAccountName }}
        {{- end }}
        # 需要修改kuberay operator的环境变量ENABLE_INIT_CONTAINER_INJECTION=false禁止自动注入容器
        initContainers:
          - name: wait-gcs-ready
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            command: [ "/bin/bash", "-lc", "--" ]
            args:
              - |
                SECONDS=0
                while true; do
                  if (( SECONDS <= 120 )); then
                    if ray health-check --address {{ include "ray-cluster.fullname" $ }}-head-svc.{{ $.Release.Namespace }}.svc.cluster.local:6379 > /dev/null 2>&1; then
                      echo "GCS is ready."
                      break
                    fi
                    echo "$SECONDS seconds elapsed: Waiting for GCS to be ready."
                  else
                    if ray health-check --address {{ include "ray-cluster.fullname" $ }}-head-svc.{{ $.Release.Namespace }}.svc.cluster.local:6379; then
                      echo "GCS is ready. Any error messages above can be safely ignored."
                      break
                    fi
                    echo "$SECONDS seconds ELAPSED: Still waiting for GCS to be ready. For troubleshooting, refer to the FAQ at https://github.com/ray-project/kuberay/blob/master/docs/guidance/FAQ.md."
                  fi
                  sleep 0.5
                done
          {{- if $.Values.global.ssl.grpcSslEnable }}
          - name: ray-worker-tls
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            command: [ "/bin/sh", "-c", "cp -R /etc/ca/tls /etc/ray && /etc/gen/tls/gencert_worker.sh" ]
            volumeMounts:
              - mountPath: /etc/ca/tls
                name: ca-tls
                readOnly: true
              - mountPath: /etc/ray/tls
                name: ray-tls
              - mountPath: /etc/gen/tls
                name: gen-tls-script
            {{- if or $.Values.global.scc.enable }}
              - name: scc-ks
                mountPath: {{ $.Values.global.scc.mountPath }}
                readOnly: true
            {{- end}}
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
          {{- end }}
          {{- with $values.ems }}
          {{- if .enable }}
          - name: init-ems-tmp-permissions
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            command:
              - sh
              - '-c'
              - |
                mkdir -p /opt/cloud/logs/ems;
                chown -h 1000:1000 /opt/cloud/logs/ems;
                chmod 2750 /opt/cloud/logs/ems;
                ls -ld /opt/cloud/logs/ems;
            volumeMounts:
              - mountPath: /opt/cloud/logs/ems
                name: xds-ems-log-volume
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            resources: {{- toYaml $values.ems.resources | nindent 14 }}
          {{- end }}
          {{- end }}
        {{- if or (and $values.softub $values.softub.enable) (and $values.hostnetwork $values.hostnetwork.enable) }}
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        {{- end }}
        containers:
          - name: ray-worker
            {{- if $values.volumeMounts }}
            volumeMounts: {{- toYaml $values.volumeMounts | nindent 12 }}
            {{- else }}
            volumeMounts:
              - mountPath: /tmp/ray
                name: log-volume
              - mountPath: /opt/cloud/logs
                name: cloud-log-volume
              - mountPath: {{ $.Values.global.storage.mountPath }}
                name: local-volume
              {{- if $values.ems }}
              {{- if $values.ems.enable }}
              - mountPath: /opt/cloud/logs/ems
                name: xds-ems-log-volume
              - mountPath: {{ $values.ems.mountPath }}
                name: ems-vol-domainsocket
              {{- end }}
              {{- end }}
              {{- if $values.ascendConfig }}
              - mountPath: {{ $values.ascendConfig.devicePluginMountPath }}
                name: device-plugin-volume
              - mountPath: {{ $values.ascendConfig.ascendToolMountPath }}
                name: ascend-tool-volume
              {{- end }}
              {{- if $.Values.global.scc.enable }}
              - name: scc-ks
                mountPath: {{ $.Values.global.scc.mountPath }}
                readOnly: true
              {{- end }}
              {{- if $.Values.global.ssl.httpSslEnable }}
              - name: ssl-resource
                mountPath: {{ $.Values.global.ssl.sslBasePath }}
                readOnly: true
              {{- end }}
              {{- if $.Values.global.ssl.grpcSslEnable}}
              - mountPath: /etc/ca/tls
                name: ca-tls
                readOnly: true
              - mountPath: /etc/ray/tls
                name: ray-tls
              - mountPath: /etc/gen/tls
                name: gen-tls-script
              {{- end}}
              - mountPath: /etc/xds/config/common
                name: xds-common-config-volume
              - mountPath: /etc/xds/config/framework
                name: xds-framework-config-volume
              - mountPath: /etc/xds/config/xds_cpp/conf
                name: xds-cpp-server-config-volume
            {{- end }}
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
            {{- if $teGroupValues.containerResources }}
            {{- /* 容器 resources 由 taskExecutorGroups.containerResources 预设值填充 */}}
            resources: {{- toYaml $teGroupValues.containerResources | nindent 14 }}
            {{- else }}
            resources: {{- toYaml $values.resources | nindent 14 }}
            {{- end }}
            {{- if $values.securityContext }}
            securityContext:
            {{- toYaml $values.securityContext | nindent 14 }}
            {{- end }}
            env:
            {{- with $.Values.common.containerEnv }}
            {{- if $teGroupValues.containerEnvOverrides }}
            {{- range . }}
            {{- if hasKey $teGroupValues.containerEnvOverrides .name }}
            {{- /* common.containerEnv 中被 containerEnvOverrides 覆盖的 key 跳过，由后续逻辑统一渲染 */}}
            {{- else }}
              - name: {{ .name }}
              {{- if .value }}
                value: {{ .value | quote }}
              {{- else if .valueFrom }}
                valueFrom: {{- toYaml .valueFrom | nindent 18 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- else }}
            {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- end }}
            {{- with $values.containerEnv }}
            {{- if $teGroupValues.containerEnvOverrides }}
            {{- /* containerEnv 中匹配 containerEnvOverrides 的环境变量由 taskExecutorGroups.containerEnvOverrides 预设值填充 */}}
            {{- range $envIdx, $envVal := . }}
            {{- if hasKey $teGroupValues.containerEnvOverrides $envVal.name }}
              - name: {{ $envVal.name }}
                value: {{ index $teGroupValues.containerEnvOverrides $envVal.name | quote }}
            {{- else }}
              - name: {{ $envVal.name }}
              {{- if $envVal.value }}
                value: {{ $envVal.value | quote }}
              {{- else if $envVal.valueFrom }}
                valueFrom: {{- toYaml $envVal.valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- else }}
            {{- toYaml . | nindent 14}}
            {{- end }}
            {{- end }}
            {{- if $teGroupValues.containerEnvOverrides }}
            {{- /* 追加 containerEnvOverrides 中新增的 key（common.containerEnv 和 $values.containerEnv 中都不存在的） */}}
            {{- range $overrideName, $overrideValue := $teGroupValues.containerEnvOverrides }}
            {{- $found := false }}
            {{- with $.Values.common.containerEnv }}
            {{- range . }}
            {{- if eq .name $overrideName }}{{- $found = true }}{{- end }}
            {{- end }}
            {{- end }}
            {{- with $values.containerEnv }}
            {{- range . }}
            {{- if eq .name $overrideName }}{{- $found = true }}{{- end }}
            {{- end }}
            {{- end }}
            {{- if not $found }}
              - name: {{ $overrideName }}
                value: {{ $overrideValue | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $.Values.global.ssl.grpcSslEnable}}
              - name: RAY_USE_TLS
                value: "1"
              - name: GRPC_SSL_CIPHER_SUITES
                value: {{ $.Values.global.ssl.tlsCipher }}
              - name: RAY_TLS_SERVER_CERT
                value: "/etc/ray/tls/tls.crt"
              - name: RAY_TLS_SERVER_KEY
                value: "/etc/ray/tls/tls.key"
              - name: RAY_TLS_CA_CERT
                value: "/etc/ca/tls/ca.crt"
              - name: RAY_TLS_SERVER_KEY_PASSWORD_ENABLE
                value: 'true'
              - name: RAY_TLS_SERVER_KEY_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ca-tls
                    key: server_key_password
            {{- end}}
              - name: ENV_SCC_CONF
                value: "/opt/cloud/scc/scc.conf"
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: RAY_gcs_rpc_server_reconnect_timeout_s
                value: '1209600'
            {{- if $isLmcachePrefill }}
              - name: LMCACHE_MP_HOST
                value: "tcp://127.0.0.1"
              - name: LMCACHE_MP_PORT
                value: {{ $lmcacheMpPort | quote }}
              - name: LMCACHE_HTTP_PORT
                value: {{ $lmcacheHttpPort | quote }}
              - name: LMCACHE_MP_MQ_TIMEOUT
                value: "1200"
            {{- end }}
            # GPU(nvidia.com/gpu)不需要GLOO/HCCL_SOCKET_IFNAME,仅NPU需要
            {{- if and (not (and $values.resources $values.resources.limits (hasKey $values.resources.limits "nvidia.com/gpu"))) (or (and $values.softub $values.softub.enable) (and $values.hostnetwork $values.hostnetwork.enable)) }}
              - name: GLOO_SOCKET_IFNAME
                value: enp23s0f3
              - name: HCCL_SOCKET_IFNAME
                value: enp
            {{- end }}
            {{- if $values.envFrom }}
            envFrom: {{- toYaml $values.envFrom | nindent 14 }}
            {{- end }}
            {{- if $values.ports }}
            {{- if $teGroupValues.portsOverrides }}
            {{- /* ports 中匹配 portsOverrides 的容器端口由 taskExecutorGroups.portsOverrides 预设值填充 */}}
            ports:
            {{- range $portIdx, $portVal := $values.ports }}
              - containerPort: {{ if and (hasKey $teGroupValues.portsOverrides $portVal.name) }}{{ index $teGroupValues.portsOverrides $portVal.name }}{{ else }}{{ $portVal.containerPort }}{{ end }}
                name: {{ $portVal.name }}
                protocol: {{ $portVal.protocol }}
            {{- end }}
            {{- else }}
            ports: {{- toYaml $values.ports | nindent 14}}
            {{- end }}
            {{- end }}
            {{- if $values.lifecycle }}
            lifecycle:
            {{- toYaml $values.lifecycle | nindent 14 }}
            {{- else }}
            lifecycle:
              preStop:
                exec:
                  command: [ "/bin/sh","-c","ray stop" ]
            {{- end }}
            {{- if $values.command }}
            command: {{- toYaml $values.command | nindent 14}}
            {{- end }}
            {{- if $values.args }}
            args: {{- toYaml $values.args | nindent 14}}
            {{- end }}
            {{- if $values.livenessProbe }}
            {{- /* 探针中 {DASHBOARD_AGENT_LISTEN_PORT} 占位变量由 taskExecutorGroups.rayStartParamsPorts.dashboard-agent-listen-port 预设值替换 */}}
            livenessProbe:
            {{- if and $teGroupValues.rayStartParamsPorts (hasKey $teGroupValues.rayStartParamsPorts "dashboard-agent-listen-port") }}
            {{- replace "{DASHBOARD_AGENT_LISTEN_PORT}" (toString (index $teGroupValues.rayStartParamsPorts "dashboard-agent-listen-port")) (toYaml $values.livenessProbe) | nindent 14 }}
            {{- else }}
            {{- toYaml $values.livenessProbe | nindent 14 }}
            {{- end }}
            {{- end}}
            {{- if $values.readinessProbe }}
            {{- /* 探针中 {DASHBOARD_AGENT_LISTEN_PORT} 占位变量由 taskExecutorGroups.rayStartParamsPorts.dashboard-agent-listen-port 预设值替换 */}}
            readinessProbe:
            {{- if and $teGroupValues.rayStartParamsPorts (hasKey $teGroupValues.rayStartParamsPorts "dashboard-agent-listen-port") }}
            {{- replace "{DASHBOARD_AGENT_LISTEN_PORT}" (toString (index $teGroupValues.rayStartParamsPorts "dashboard-agent-listen-port")) (toYaml $values.readinessProbe) | nindent 14 }}
            {{- else }}
            {{- toYaml $values.readinessProbe | nindent 14 }}
            {{- end }}
            {{- end}}
            {{- if $values.startupProbe }}
            {{- /* 探针中 {DASHBOARD_AGENT_LISTEN_PORT} 占位变量由 taskExecutorGroups.rayStartParamsPorts.dashboard-agent-listen-port 预设值替换 */}}
            startupProbe:
            {{- if and $teGroupValues.rayStartParamsPorts (hasKey $teGroupValues.rayStartParamsPorts "dashboard-agent-listen-port") }}
            {{- replace "{DASHBOARD_AGENT_LISTEN_PORT}" (toString (index $teGroupValues.rayStartParamsPorts "dashboard-agent-listen-port")) (toYaml $values.startupProbe) | nindent 14 }}
            {{- else }}
            {{- toYaml $values.startupProbe | nindent 14 }}
            {{- end }}
            {{- end}}
          {{- if $isLmcachePrefill }}
          - name: lmcache-sidecar
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
            securityContext:
              privileged: true
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: true
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RESOURCE
            env:
              - name: LMCACHE_LOG_LEVEL
                value: {{ $lmcache.logLevel | quote }}
              - name: NVIDIA_VISIBLE_DEVICES
                value: all
              - name: CUDA_VISIBLE_DEVICES
                value: all
              - name: NVIDIA_DRIVER_CAPABILITIES
                value: all
              - name: LD_LIBRARY_PATH
                value: /usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/local/cuda/lib64:/usr/local/cuda/targets/x86_64-linux/lib:/usr/local/lib/python3.12/dist-packages/torch/lib:/usr/local/lib/python3.12/dist-packages/nvidia/cu13/lib
            command: ["/bin/bash", "-lc", "--"]
            args:
              - |
                set -euo pipefail
                ulimit -l unlimited || true
                exec lmcache server \
                  --host 127.0.0.1 \
                  --port {{ $lmcacheMpPort }} \
                  --http-host 127.0.0.1 \
                  --http-port {{ $lmcacheHttpPort }} \
                  --l1-init-size-gb {{ $lmcache.l1InitSizeGb }} \
                  --l1-size-gb {{ $lmcache.l1SizeGb }} \
                  --l1-align-bytes {{ $lmcache.l1AlignBytes }} \
                  --chunk-size 256 \
                  --max-workers {{ $lmcache.maxWorkers }} \
                  --no-l1-use-lazy
            ports:
              - name: lmcache-mp
                containerPort: {{ $lmcacheMpPort }}
                protocol: TCP
              - name: lmcache-http
                containerPort: {{ $lmcacheHttpPort }}
                protocol: TCP
            resources: {{- toYaml $lmcache.resources | nindent 14 }}
            volumeMounts:
              - name: lmcache-host-shm
                mountPath: /dev/shm
              - name: lmcache-host-nvidia
                mountPath: /usr/local/nvidia
                readOnly: true
          {{- end }}
          {{- if $values.sidecarContainers }}
          {{- toYaml $values.sidecarContainers | nindent 10 }}
          {{- end }}
        {{- if $values.volumes }}
        volumes: {{- toYaml $values.volumes | nindent 10 }}
        {{- if $isLmcachePrefill }}
          - name: lmcache-host-shm
            hostPath:
              path: /dev/shm
              type: Directory
          - name: lmcache-host-nvidia
            hostPath:
              path: /usr/local/nvidia
              type: Directory
        {{- end }}
        {{- else }}
        volumes:
          - name: log-volume
            emptyDir: {}
          - name: cloud-log-volume
            emptyDir: {}
          {{- if $values.ems }}
          {{- if $values.ems.enable }}
          - name: xds-ems-log-volume
            emptyDir: {}
          - name: ems-vol-domainsocket
            hostPath:
              path: {{ $values.ems.hostPath }}
          {{- end }}
          {{- end }}
          - name: local-volume
            hostPath:
              path: {{ $.Values.global.storage.hostPath }}
              type: Directory
          {{- if $values.ascendConfig }}
          - name: device-plugin-volume
            hostPath:
              path: {{ $values.ascendConfig.devicePluginHostPath }}
              type: Directory
          - name: ascend-tool-volume
            hostPath:
              path: {{ $values.ascendConfig.ascendToolHostPath }}
              type: Directory
          {{- end }}
          {{- if $.Values.global.scc.enable }}
          - name: scc-ks
            secret:
              secretName: {{ required "primary key for scc decrypt is required" $.Values.global.scc.secretName }}
              defaultMode: 256
          {{- else }}
          - name: scc-ks
            emptyDir: { }
          {{- end }}
          {{- if $.Values.global.ssl.httpSslEnable }}
          - name: ssl-resource
            secret:
              secretName: {{ required "primary key for ssl resource is required" $.Values.global.ssl.secretName }}
              defaultMode: 256
          {{- end }}
          {{- if $.Values.global.ssl.grpcSslEnable}}
          - name: ca-tls
            secret:
              secretName: ca-tls
          - name: ray-tls
            emptyDir: { }
          - name: gen-tls-script
            configMap:
              name: tls
              defaultMode: 0777
              items:
                - key: gencert_worker.sh
                  path: gencert_worker.sh
          {{- end}}
          - name: xds-common-config-volume
            configMap:
              name: xds-common-config
          - name: xds-framework-config-volume
            configMap:
              name: xds-framework-config
          - name: xds-cpp-server-config-volume
            configMap:
              name: xds-cpp-server-config
          {{- if $isLmcachePrefill }}
          - name: lmcache-host-shm
            hostPath:
              path: /dev/shm
              type: Directory
          - name: lmcache-host-nvidia
            hostPath:
              path: /usr/local/nvidia
              type: Directory
          {{- end }}
        {{- end }}
        {{- if or $values.podAntiAffinity $values.nodeAffinity (contains "decode" (lower $teGroupValues.name)) }}
        affinity:
          {{- if or $values.podAntiAffinity (contains "decode" (lower $teGroupValues.name)) }}
          podAntiAffinity:
            {{- if $values.podAntiAffinity }}
            {{- toYaml $values.podAntiAffinity | nindent 12 }}
            {{- end }}
            {{- if contains "decode" (lower $teGroupValues.name) }}
            {{- /* Decode 类型 TE 自动注入 podAntiAffinity，避免 Decode Pod 调度到同一节点 */}}
            preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ray.io/group
                        operator: In
                        values:
                          - taskExecutorGroupDecode
                  namespaceSelector:
                    matchLabels:
                      team: headTeam
                  topologyKey: kubernetes.io/hostname
                weight: 100
            {{- end }}
          {{- end }}
          {{- if $values.nodeAffinity }}
          nodeAffinity: {{- toYaml $values.nodeAffinity | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if $values.tolerations }}
        tolerations: {{- toYaml $values.tolerations | nindent 10 }}
        {{- else if $.Values.tolerations }}
        tolerations: {{- toYaml $.Values.tolerations | nindent 10 }}
        {{- end }}
        {{- if $teGroupValues.nodeSelector }}
        nodeSelector: {{- toYaml $teGroupValues.nodeSelector | nindent 10 }}
        {{- end }}
        {{- if $values.schedulerName }}
        schedulerName: {{ $values.schedulerName }}
        {{- end }}
        securityContext:
          {{- if or (and $values.softub $values.softub.enable) (and $values.hostnetwork $values.hostnetwork.enable) }}
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
          {{- else }}
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          {{- end }}
          {{- if $values.ems }}
          {{- if $values.ems.enable }}
          supplementalGroups:
            - 1001
          {{- end }}
          {{- end }}
        {{- if $values.terminationGracePeriodSeconds }}
        terminationGracePeriodSeconds: {{ $values.terminationGracePeriodSeconds }}
        {{- else }}
        terminationGracePeriodSeconds: 0
        {{- end }}
      metadata:
        {{- if $values.annotations }}
        annotations: {{- toYaml $values.annotations | nindent 10 }}
        {{- end }}
        {{- if $values.labels }}
        labels: {{- toYaml $values.labels | nindent 10 }}
{{ include "ray-cluster.labels" $ | indent 10 }}
        {{ else }}
        labels: {{ include "ray-cluster.labels" $ | nindent 10 }}
        {{- end }}

  {{- end }}
  {{- else if and (eq $groupName "taskExecutorGroup16") (eq $.Values.global.enableTaskExecutorGroups true) }}
  {{- /* [Skip 16] taskExecutorGroup16在TE开启时跳过渲染（k8s模板不支持node模式，仅支持card模式） */}}
  {{- else if and (eq $groupName "taskExecutorGroup-card") (or (ne $.Values.global.enableTaskExecutorGroups true) (ne $.Values.global.taskExecutorGroupType "card")) }}
  {{- /* [Skip card] taskExecutorGroup-card在非card模式下跳过渲染（enableTaskExecutorGroups=false或taskExecutorGroupType!="card"） */}}
  {{- else }}
  {{- /* [Default分支] 非TE分组workerGroup按原有逻辑渲染（enableTaskExecutorGroups=false时所有workerGroup都走此分支） */}}
  {{- if and (ne $values.disabled true) (or (not $.Values.global.useFemFrontend) (ne $groupName "frontGroup")) }}
  - rayStartParams:
    {{- if and (not $values.rayStartParams) (not $values.initArgs) }}
      {}
    {{- else }}
      {{- range $key, $val := $values.rayStartParams }}
        {{ $key }}: {{ $val | quote }}
      {{- end }}
      {{- /*
      initArgs is a deprecated alias for rayStartParams.
      */}}
      {{- range $key, $val := $values.initArgs }}
        {{ $key }}: {{ $val | quote }}
      {{- end }}
    {{- end }}
    replicas: {{ $values.replicas }}
    minReplicas: {{ $values.minReplicas | default 0 }}
    maxReplicas: {{ $values.maxReplicas | default 2147483647 }}
    numOfHosts: {{ $values.numOfHosts | default 1 }}
    groupName: {{ $groupName }}
    template:
      spec:
        restartPolicy: {{ $.Values.global.restartPolicy.worker }}
        automountServiceAccountToken: {{ $.Values.global.enableAutomountServiceAccountToken }}
        imagePullSecrets: {{- toYaml $.Values.global.imagePullSecrets | nindent 10 }}
        {{- if $.Values.global.serviceAccountName }}
        serviceAccountName: {{ $.Values.global.serviceAccountName }}
        {{- end }}
        # 需要修改kuberay operator的环境变量ENABLE_INIT_CONTAINER_INJECTION=false禁止自动注入容器
        initContainers:
          - name: wait-gcs-ready
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            command: [ "/bin/bash", "-lc", "--" ]
            args:
              - |
                SECONDS=0
                while true; do
                  if (( SECONDS <= 120 )); then
                    if ray health-check --address {{ include "ray-cluster.fullname" $ }}-head-svc.{{ $.Release.Namespace }}.svc.cluster.local:6379 > /dev/null 2>&1; then
                      echo "GCS is ready."
                      break
                    fi
                    echo "$SECONDS seconds elapsed: Waiting for GCS to be ready."
                  else
                    if ray health-check --address {{ include "ray-cluster.fullname" $ }}-head-svc.{{ $.Release.Namespace }}.svc.cluster.local:6379; then
                      echo "GCS is ready. Any error messages above can be safely ignored."
                      break
                    fi
                    echo "$SECONDS seconds ELAPSED: Still waiting for GCS to be ready. For troubleshooting, refer to the FAQ at https://github.com/ray-project/kuberay/blob/master/docs/guidance/FAQ.md."
                  fi
                  sleep 0.5
                done
          {{- if $.Values.global.ssl.grpcSslEnable }}
          - name: ray-worker-tls
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            command: [ "/bin/sh", "-c", "cp -R /etc/ca/tls /etc/ray && /etc/gen/tls/gencert_worker.sh" ]
            volumeMounts:
              - mountPath: /etc/ca/tls
                name: ca-tls
                readOnly: true
              - mountPath: /etc/ray/tls
                name: ray-tls
              - mountPath: /etc/gen/tls
                name: gen-tls-script
            {{- if or $.Values.global.scc.enable }}
              - name: scc-ks
                mountPath: {{ $.Values.global.scc.mountPath }}
                readOnly: true
            {{- end}}
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
          {{- end }}
          {{- with $values.ems }}
          {{- if .enable }}
          - name: init-ems-tmp-permissions
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            command:
              - sh
              - '-c'
              - |
                mkdir -p /opt/cloud/logs/ems;
                chown -h 1000:1000 /opt/cloud/logs/ems;
                chmod 2750 /opt/cloud/logs/ems;
                ls -ld /opt/cloud/logs/ems;
            volumeMounts:
              - mountPath: /opt/cloud/logs/ems
                name: xds-ems-log-volume
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            resources: {{- toYaml $values.ems.resources | nindent 14 }}
          {{- end }}
          {{- end }}
        {{- if or (and $values.softub $values.softub.enable) (and $values.hostnetwork $values.hostnetwork.enable) }}
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        {{- end }}
        containers:
          - name: ray-worker
            {{- if $values.volumeMounts }}
            volumeMounts: {{- toYaml $values.volumeMounts | nindent 12 }}
            {{- else }}
            volumeMounts:
              - mountPath: /tmp/ray
                name: log-volume
              - mountPath: /opt/cloud/logs
                name: cloud-log-volume
              - mountPath: {{ $.Values.global.storage.mountPath }}
                name: local-volume
              {{- if $values.ems }}
              {{- if $values.ems.enable }}
              - mountPath: /opt/cloud/logs/ems
                name: xds-ems-log-volume
              - mountPath: {{ $values.ems.mountPath }}
                name: ems-vol-domainsocket
              {{- end }}
              {{- end }}
              {{- if $values.ascendConfig }}
              - mountPath: {{ $values.ascendConfig.devicePluginMountPath }}
                name: device-plugin-volume
              - mountPath: {{ $values.ascendConfig.ascendToolMountPath }}
                name: ascend-tool-volume
              {{- end }}
              {{- if $.Values.global.scc.enable }}
              - name: scc-ks
                mountPath: {{ $.Values.global.scc.mountPath }}
                readOnly: true
              {{- end }}
              {{- if $.Values.global.ssl.httpSslEnable }}
              - name: ssl-resource
                mountPath: {{ $.Values.global.ssl.sslBasePath }}
                readOnly: true
              {{- end }}
              {{- if $.Values.global.ssl.grpcSslEnable}}
              - mountPath: /etc/ca/tls
                name: ca-tls
                readOnly: true
              - mountPath: /etc/ray/tls
                name: ray-tls
              - mountPath: /etc/gen/tls
                name: gen-tls-script
              {{- end}}
              - mountPath: /etc/xds/config/common
                name: xds-common-config-volume
              - mountPath: /etc/xds/config/framework
                name: xds-framework-config-volume
              - mountPath: /etc/xds/config/xds_cpp/conf
                name: xds-cpp-server-config-volume
            {{- end }}
            image: {{ $.Values.global.imageRegistry }}/{{ $.Values.global.images.ray }}
            imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
            resources: {{- toYaml $values.resources | nindent 14 }}
            {{- if $values.securityContext }}
            securityContext:
            {{- toYaml $values.securityContext | nindent 14 }}
            {{- end }}
            env:
            {{- with $.Values.common.containerEnv }}
            {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $values.containerEnv }}
            {{- toYaml . | nindent 14}}
            {{- end }}
            {{- if $.Values.global.ssl.grpcSslEnable}}
              - name: RAY_USE_TLS
                value: "1"
              - name: GRPC_SSL_CIPHER_SUITES
                value: {{ $.Values.global.ssl.tlsCipher }}
              - name: RAY_TLS_SERVER_CERT
                value: "/etc/ray/tls/tls.crt"
              - name: RAY_TLS_SERVER_KEY
                value: "/etc/ray/tls/tls.key"
              - name: RAY_TLS_CA_CERT
                value: "/etc/ca/tls/ca.crt"
              - name: RAY_TLS_SERVER_KEY_PASSWORD_ENABLE
                value: 'true'
              - name: RAY_TLS_SERVER_KEY_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ca-tls
                    key: server_key_password
            {{- end}}
              - name: ENV_SCC_CONF
                value: "/opt/cloud/scc/scc.conf"
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: RAY_gcs_rpc_server_reconnect_timeout_s
                value: '1209600'
            # GPU(nvidia.com/gpu)不需要GLOO/HCCL_SOCKET_IFNAME,仅NPU需要
            {{- if and (not (and $values.resources $values.resources.limits (hasKey $values.resources.limits "nvidia.com/gpu"))) (or (and $values.softub $values.softub.enable) (and $values.hostnetwork $values.hostnetwork.enable)) }}
              - name: GLOO_SOCKET_IFNAME
                value: enp23s0f3
              - name: HCCL_SOCKET_IFNAME
                value: enp
            {{- end }}
            {{- if $values.envFrom }}
            envFrom: {{- toYaml $values.envFrom | nindent 14 }}
            {{- end }}
            {{- if $values.ports }}
            ports: {{- toYaml $values.ports | nindent 14}}
            {{- end }}
            {{- if $values.lifecycle }}
            lifecycle:
            {{- toYaml $values.lifecycle | nindent 14 }}
            {{- else }}
            lifecycle:
              preStop:
                exec:
                  command: [ "/bin/sh","-c","ray stop" ]
            {{- end }}
            {{- if $values.command }}
            command: {{- toYaml $values.command | nindent 14}}
            {{- end }}
            {{- if $values.args }}
            args: {{- toYaml $values.args | nindent 14}}
            {{- end }}
            {{- if $values.livenessProbe }}
            livenessProbe:
            {{- toYaml $values.livenessProbe | nindent 14 }}
            {{- end}}
            {{- if $values.readinessProbe }}
            readinessProbe:
            {{- toYaml $values.readinessProbe | nindent 14 }}
            {{- end}}
            {{- if $values.startupProbe }}
            startupProbe:
            {{- toYaml $values.startupProbe | nindent 14 }}
            {{- end}}
          {{- if $values.sidecarContainers }}
          {{- toYaml $values.sidecarContainers | nindent 10 }}
          {{- end }}
        {{- if $values.volumes }}
        volumes: {{- toYaml $values.volumes | nindent 10 }}
        {{- else }}
        volumes:
          - name: log-volume
            emptyDir: {}
          - name: cloud-log-volume
            emptyDir: {}
          {{- if $values.ems }}
          {{- if $values.ems.enable }}
          - name: xds-ems-log-volume
            emptyDir: {}
          - name: ems-vol-domainsocket
            hostPath:
              path: {{ $values.ems.hostPath }}
          {{- end }}
          {{- end }}
          - name: local-volume
            hostPath:
              path: {{ $.Values.global.storage.hostPath }}
              type: Directory
          {{- if $values.ascendConfig }}
          - name: device-plugin-volume
            hostPath:
              path: {{ $values.ascendConfig.devicePluginHostPath }}
              type: Directory
          - name: ascend-tool-volume
            hostPath:
              path: {{ $values.ascendConfig.ascendToolHostPath }}
              type: Directory
          {{- end }}
          {{- if $.Values.global.scc.enable }}
          - name: scc-ks
            secret:
              secretName: {{ required "primary key for scc decrypt is required" $.Values.global.scc.secretName }}
              defaultMode: 256
          {{- else }}
          - name: scc-ks
            emptyDir: { }
          {{- end }}
          {{- if $.Values.global.ssl.httpSslEnable }}
          - name: ssl-resource
            secret:
              secretName: {{ required "primary key for ssl resource is required" $.Values.global.ssl.secretName }}
              defaultMode: 256
          {{- end }}
          {{- if $.Values.global.ssl.grpcSslEnable}}
          - name: ca-tls
            secret:
              secretName: ca-tls
          - name: ray-tls
            emptyDir: { }
          - name: gen-tls-script
            configMap:
              name: tls
              defaultMode: 0777
              items:
                - key: gencert_worker.sh
                  path: gencert_worker.sh
          {{- end}}
          - name: xds-common-config-volume
            configMap:
              name: xds-common-config
          - name: xds-framework-config-volume
            configMap:
              name: xds-framework-config
          - name: xds-cpp-server-config-volume
            configMap:
              name: xds-cpp-server-config
        {{- end }}
        {{- if or $values.podAntiAffinity $values.nodeAffinity }}
        affinity:
          {{- if $values.podAntiAffinity }}
          podAntiAffinity: {{- toYaml $values.podAntiAffinity | nindent 12 }}
          {{- end }}
          {{- if $values.nodeAffinity }}
          nodeAffinity: {{- toYaml $values.nodeAffinity | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if $values.tolerations }}
        tolerations: {{- toYaml $values.tolerations | nindent 10 }}
        {{- else if $.Values.tolerations }}
        tolerations: {{- toYaml $.Values.tolerations | nindent 10 }}
        {{- end }}
        {{- if $values.nodeSelector }}
        nodeSelector: {{- toYaml $values.nodeSelector | nindent 10 }}
        {{- end }}
        {{- if $values.schedulerName }}
        schedulerName: {{ $values.schedulerName }}
        {{- end }}
        securityContext:
          {{- if or (and $values.softub $values.softub.enable) (and $values.hostnetwork $values.hostnetwork.enable) }}
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
          {{- else }}
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          {{- end }}
          {{- if $values.ems }}
          {{- if $values.ems.enable }}
          supplementalGroups:
            - 1001
          {{- end }}
          {{- end }}
        {{- if $values.terminationGracePeriodSeconds }}
        terminationGracePeriodSeconds: {{ $values.terminationGracePeriodSeconds }}
        {{- else }}
        terminationGracePeriodSeconds: 0
        {{- end }}
      metadata:
        {{- if $values.annotations }}
        annotations: {{- toYaml $values.annotations | nindent 10 }}
        {{- end }}
        {{- if $values.labels }}
        labels: {{- toYaml $values.labels | nindent 10 }}
{{ include "ray-cluster.labels" $ | indent 10 }}
        {{ else }}
        labels: {{ include "ray-cluster.labels" $ | nindent 10 }}
        {{- end }}

  {{- end }}
  {{- end }}
  {{- end }}

---
{{- if not (lookup "scheduling.k8s.io/v1" "PriorityClass" "" "io-priority-3") }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: io-priority-3
value: -3
globalDefault: false
preemptionPolicy: Never
description: "For io-priority-3 workloads"
{{- end }}
---
{{- if not (lookup "scheduling.k8s.io/v1" "PriorityClass" "" "io-priority-2") }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: io-priority-2
value: -2
globalDefault: false
preemptionPolicy: Never
description: "For io-priority-2 workloads"
{{- end }}
