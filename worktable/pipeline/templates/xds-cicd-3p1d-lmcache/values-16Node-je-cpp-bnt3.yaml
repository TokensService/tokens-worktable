        memory: 70Gi
        hugepages-2Mi: "0"
      requests:
        cpu: '20'
        nvidia.com/gpu: 8
        memory: 70Gi
        hugepages-2Mi: "0"
    schedulerName: volcano
    securityContext:
      privileged: true
      capabilities:
        add:
          - NET_ADMIN
          - NET_RAW
          - DAC_OVERRIDE
          - SYS_MODULE
          - SYS_PTRACE
          - SYS_RAWIO
          - FOWNER
          - SETPCAP
          - SYS_NICE
    ems:
      enable: true
      hostPath: /mnt/paas/kubernetes/kubelet/ems
      mountPath: /dev/shm/ems
      resources:
        limits:
          cpu: '2'
          memory: 128Mi
        requests:
          cpu: '2'
          memory: 128Mi
    softub:
      enable: false
    hostnetwork:
      enable: true

# LMCache is colocated with each Prefill TE by the Chart template.  The
# renderer only resolves these placeholders; it never builds a sidecar list.
# A prefill group ordinal is used to make host-networked local ports unique
# when several Prefill TEs share the same node.
lmcacheSidecar:
  enabled: {LMCACHE_SIDECAR_ENABLED}
  mpPortBase: {LMCACHE_MP_PORT_BASE}
  httpPortBase: {LMCACHE_HTTP_PORT_BASE}
  l1InitSizeGb: {LMCACHE_L1_INIT_SIZE_GB}
  l1SizeGb: {LMCACHE_L1_SIZE_GB}
  l1AlignBytes: {LMCACHE_L1_ALIGN_BYTES}
  maxWorkers: {LMCACHE_MAX_WORKERS}
  logLevel: {LMCACHE_LOG_LEVEL}
  resources:
    requests:
      cpu: {LMCACHE_CPU_REQUEST}
      memory: {LMCACHE_MEMORY_REQUEST}
    limits:
      cpu: {LMCACHE_CPU_LIMIT}
      memory: {LMCACHE_MEMORY_LIMIT}

# FE Pod 模板配置 (非ray worker)
feTemplate:
  default_replica: 10
  annotations:
    max_count_on_node: "10"
  containerEnv: []
  command:
    - /bin/bash
    - '-c'
    - '--'
  args:
    - 'source /home/service/.bashrc; ulimit -n 65536; source /usr/local/xds_cpp/script/setenv.bash; python3 /home/service/prelaunch/check_max_pod_config.py || exit 1; BAK_DIR="/opt/cloud/logs/ray/bak_$(date +%Y%m%d_%H%M%S)"; mkdir -p "$BAK_DIR"; mv /opt/cloud/logs/ray/session_* "$BAK_DIR/" 2>/dev/null || true; ray start --address=$RAY_ADDRESS; exec python3 -m xds.frontend.frontend_executor_main --fe-id=$POD_NAME --fem-endpoint=FrontendExecutorManager'
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: ray.io/group
                operator: In
                values:
                  - frontGroup
          namespaceSelector: {}
          topologyKey: kubernetes.io/hostname
        weight: 100
  labels: {}
  terminationGracePeriodSeconds: 2100
  lifecycle:
    preStop:
      exec:
        command:
          - /bin/bash
          - -c
          - |
            CURL_OPTS="-s --connect-timeout 3 --max-time 10"
            if [ "$FE_SCHEME" = "https" ]; then
              CURL_OPTS="$CURL_OPTS -k --cert $SSL_DIR/module.crt --key $SSL_DIR/module.key"
              CERT_PASS=$(python3 -c "from xds.config.constants import ENABLE_SENSITIVE_INFO_DECRYPT; from xds.framework.utils.scc_util import decrypt_pad; pwd=open('$SSL_DIR/cert_pwd').read().strip(); print(decrypt_pad(pwd) if ENABLE_SENSITIVE_INFO_DECRYPT else pwd)" 2>/dev/null)
              if [ -n "$CERT_PASS" ]; then CURL_OPTS="$CURL_OPTS --pass $CERT_PASS"; fi
            fi
            check_process_alive() { kill -0 1 2>/dev/null; }
            until [ "$(curl $CURL_OPTS -o /dev/null -w "%{http_code}" -X POST ${FE_SCHEME}://localhost:${FE_PORT}/drain 2>/dev/null)" = "200" ]; do
              check_process_alive || exit 0
              sleep 1
            done
            sleep $(((${FE_READY_FAILURE_THRESHOLD:-3} + 1) * (${FE_READY_PERIOD_SECONDS:-5} + ${FE_READY_TIMEOUT_SECONDS:-5})))
            until [ "$(curl $CURL_OPTS -o /dev/null -w "%{http_code}" -X POST ${FE_SCHEME}://localhost:${FE_PORT}/reject 2>/dev/null)" = "200" ]; do
              check_process_alive || exit 0
              sleep 1
            done
            # 等待keep alive连接全部断掉 该值需要大于fe的uvicorn配置的timeout_keep_alive
            sleep 70
            while check_process_alive; do
              ongoing=$(curl $CURL_OPTS ${FE_SCHEME}://localhost:${FE_PORT}/metrics 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('ongoing_requests',1))" 2>/dev/null)
              [ "$ongoing" = "0" ] && break
              sleep 5
            done
            kill -9 1
  nodeSelector:
    {}
  # schedulerName: volcano
  tolerations:
    - key: xds/node-monitor-taint
      operator: Exists
  livenessProbe:
    httpGet:
      path: /health
    failureThreshold: 60
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
    failureThreshold: 3
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 5
  startupProbe:
    httpGet:
      path: /health
    failureThreshold: 60
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  resources:
    limits:
      cpu: '2'
      memory: 10Gi
    requests:
      cpu: '2'
      memory: 10Gi
