      {XDS_TE_POD_LABEL_KEY}: {XDS_TE_POD_LABEL_VAL}
    rayStartParams:
      block: 'true'
      dashboard-agent-listen-port: 52365
      num-gpus: 8
      node-ip-address: $POD_IP
      resources: '"{\"GPU\":8,\"XDS-TE\":4}"'
    terminationGracePeriodSeconds: 2100
    lifecycle:
      preStop:
        exec:
          command:
            - /bin/bash
            - -c
            - |
              TE_SCHEME=${TE_SCHEME:-http}
              TE_SERVER_PORT=${TE_SERVER_PORT:-8088}
              # enable_te_server!=true 时跳过 drain，直接退出
              if [ "${ENABLE_TE_SERVER:-false}" != "true" ]; then
                timeout 30 ray stop || true
                pkill -KILL -f 'ray start' 2>/dev/null || true
                exit 0
              fi
              while true; do
                curl -s -X POST ${TE_SCHEME}://localhost:${TE_SERVER_PORT}/drain || true
                resp_full=$(curl -s -w "\n%{http_code}" ${TE_SCHEME}://localhost:${TE_SERVER_PORT}/ready_to_delete 2>/dev/null)
                curl_rc=$?
                http_code=$(echo "$resp_full" | tail -1)
                if [ $curl_rc -ne 0 ] || [ "$http_code" != "200" ]; then
                  if ! ps -ef | grep -q '[r]ay::VLLMInferenceTaskExecutor'; then
                    break
                  fi
                  sleep 5
                  continue
                fi
                resp=$(echo "$resp_full" | sed '$d')
                ready=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ready',False))" 2>/dev/null)
                if [ "$ready" = "True" ]; then break; fi
                sleep 5
              done
              timeout 30 ray stop || true
              pkill -KILL -f 'ray start' 2>/dev/null || true
    livenessProbe:
      exec:
        command:
          - bash
          - '-c'
          - |
            wget -T 2 -q -O- http://localhost:{DASHBOARD_AGENT_LISTEN_PORT}/api/local_raylet_healthz | grep success
