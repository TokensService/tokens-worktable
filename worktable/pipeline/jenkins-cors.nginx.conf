# Jenkins CORS 反代：只负责补 CORS 头 + 应答预检(OPTIONS)，业务流量原样转发给 Jenkins
# 用法：
#   1) 放到 nginx 的 conf.d/，如 /etc/nginx/conf.d/jenkins-cors.conf
#   2) nginx -t 通过后  nginx -s reload
#   3) 把页面「Jenkins 地址」改为  http://<本机IP>:18081
# 说明：用 $http_origin（回显请求源）而不用 *，因为带 Authorization 认证时浏览器拒绝 * 通配；
#       always 保证错误响应(如 401)也带上 CORS 头。

upstream jenkins_upstream {
    # 本配置按「nginx 与 Jenkins 同机」部署，用本机回环即可；
    # 若 nginx 装在另一台机器，把下一行改成 server 7.242.105.149:18080;
    server 127.0.0.1:18080;
}

server {
    listen 18081;

    location / {
        # 预检(OPTIONS)：直接回 204 + CORS 头，不转发给 Jenkins
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Jenkins-Crumb, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        # 正常请求：回 CORS 头 + 转发给 Jenkins
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://jenkins_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
