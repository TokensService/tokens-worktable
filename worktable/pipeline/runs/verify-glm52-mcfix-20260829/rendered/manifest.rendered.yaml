# Source: xds-cluster/templates/fe-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-executor
  namespace: xds-glm-5.2-nvfp4-local
  labels:
    app: frontend-executor
    xds-component: frontend
    helm.sh/chart: xds-cluster-1.0.20
    app.kubernetes.io/instance: verify-render
spec:
  replicas: 10
  selector:
    matchLabels:
      app: frontend-executor
      xds-component: frontend
  template:
    metadata:
      annotations:
        max_count_on_node: "10"
      labels:
        app: frontend-executor
        xds-component: frontend
        ray.io/group: frontGroup
    spec:
      restartPolicy: "Always"
      automountServiceAccountToken: true
      imagePullSecrets:
        null
      serviceAccountName: xds-glm-5.2-nvfp4-local-sa
      initContainers:
        - name: wait-gcs-ready
          image: swr.cn-southwest-283.myhuaweicloud.com/serverlessai/xds:0730_dev_bnt3_mc_fix.20260828212101.BNT3.x86_64
          command: [ "/bin/bash", "-lc", "--" ]
          args:
            - |
              SECONDS=0
              while true; do
                if (( SECONDS <= 120 )); then
                  if ray health-check --address verify-render-kuberay-head-svc.xds-glm-5.2-nvfp4-local.svc.cluster.local:6379 > /dev/null 2>&1; then
                    echo "GCS is ready."
                    break
                  fi
                  echo "$SECONDS seconds elapsed: Waiting for GCS to be ready."
                else
                  if ray health-check --address verify-render-kuberay-head-svc.xds-glm-5.2-nvfp4-local.svc.cluster.local:6379; then
                    echo "GCS is ready. Any error messages above can be safely ignored."
                    break
                  fi
                  echo "$SECONDS seconds ELAPSED: Still waiting for GCS to be ready."
                fi
                sleep 0.5
              done
      containers:
        - name: frontend-executor
          image: swr.cn-southwest-283.myhuaweicloud.com/serverlessai/xds:0730_dev_bnt3_mc_fix.20260828212101.BNT3.x86_64
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - --
          args:
            - source /home/service/.bashrc; ulimit -n 65536; source /usr/local/xds_cpp/script/setenv.bash;
              python3 /home/service/prelaunch/check_max_pod_config.py || exit 1; ray start --address=$RAY_ADDRESS;
              exec python3 -m xds.frontend.frontend_executor_main --fe-id=$POD_NAME --fem-endpoint=FrontendExecutorManager
          env:
            - name: RAY_min_memory_free_bytes
              value: "2147483648"
            - name: RAY_SERVE_CONTROL_LOOP_INTERVAL_S
              value: "10"
            - name: RAY_gcs_rpc_server_connect_timeout_s
              value: "10"
            - name: RAY_maximum_gcs_destroyed_actor_cached_count
              value: "2000"
            - name: MC_USE_TENT
              value: "1"
            - name: MC_TENT_CONF
              value: '{"topology":{"rdma_whitelist":["mlx5_bond_1","mlx5_bond_2","mlx5_bond_3","mlx5_bond_4","mlx5_bond_5","mlx5_bond_6","mlx5_bond_7","mlx5_bond_8"],"rdma_blacklist":[]},"transports":{"nvlink":{"enable":false},"rdma":{"enable":true,"device":{"gid_index":3},"workers":{"max_retry_count":1}}}}'
            - name: XDS_COMMON_CONFIGMAP_FILE
              value: /etc/xds/config/common/xds_common.conf
            - name: XDS_FRAMEWORK_CONFIGMAP_FILE
              value: /etc/xds/config/framework/xds_framework.conf
            - name: XDS_JOB_EXECUTION_CONFIGMAP_FILE
              value: /etc/xds/config/framework/job_execution_config.json
            - name: RAY_ROTATION_MAX_BYTES
              value: "104857600"
            - name: RAY_ROTATION_BACKUP_COUNT
              value: "10"
            - name: RAY_num_server_call_thread
              value: "1"
            - name: RAY_DEDUP_LOGS
              value: "0"
            - name: INF_NAN_MODE_ENABLE
              value: "0"
            - name: INF_NAN_MODE_FORCE_DISABLE
              value: "1"
            - name: NUMEXPR_MAX_THREADS
              value: "16"
            - name: RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES
              value: "1"
            - name: ENABLE_MYSQL_ENCRYPT
              value: "false"
            - name: EMS_SDK_LOG
              value: /opt/cloud/logs/ems
            - name: EMS_ENABLE_SEPARATE_THREAD_POOL
              value: "1"
            - name: EMS_MAIN_LOAD_THREAD_SIZE
              value: "2"
            - name: EMS_MAIN_SAVE_THREAD_SIZE
              value: "24"
            - name: EMS_MID_REQ_QUEUE_NUM
              value: "1"
            - name: EMS_MAX_TASK_NUM_PER_QUEUE
              value: "8196"
            - name: ENABLE_MKI_LOG
              value: "1"
            - name: VLLM_MQ_MAX_CHUNKS
              value: "20"
            - name: VLLM_GC_ENABLED
              value: "1"
            - name: VLLM_GC_CHECK_INTERVAL
              value: "400"
            - name: VLLM_GC_THRESHOLD
              value: "0.95"
            - name: VLLM_GC_EMERGENCY_THRESHOLD
              value: "0.97"
            - name: XCCL_TURBO_PREFILL_MLA_HEAD_PADDING
