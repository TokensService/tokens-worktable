              value: "verify-render-kuberay-head-svc.xds-glm-5.2-nvfp4-local.svc.cluster.local:6379"
          ports:
            - name: frontend-port
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/xds/config/framework
              name: xds-framework-config-volume
            - mountPath: /opt/cloud/logs
              name: cloud-log-volume
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/bash
                - -c
                - |
                  CURL_OPTS="-s --connect-timeout 3 --max-time 10"
                  if [ "$FE_SCHEME" = "https" ]; then
                    CURL_OPTS="$CURL_OPTS -k --cert $SSL_DIR/module.crt --key $SSL_DIR/module.key"
                    CERT_PASS=$(python3 -c "from xds.config.constants import ENABLE_SENSITIVE_INFO_DECRYPT; from xds.framework.utils.scc_util import decrypt_pad; pwd=open('$SSL_DIR/cert_pwd').read().strip(); print(decrypt_pad(pwd) if ENABLE_SENSITIVE_INFO_DECRYPT else pwd)" 2>/dev/null)
                    if [ -n "$CERT_PASS" ]; then CURL_OPTS="$CURL_OPTS --pass $CERT_PASS"; fi
                  fi
                  check_process_alive() { kill -0 1 2>/dev/null; }
                  until [ "$(curl $CURL_OPTS -o /dev/null -w "%{http_code}" -X POST $http://localhost:$8000/drain 2>/dev/null)" = "200" ]; do
                    check_process_alive || exit 0
                    sleep 1
                  done
                  sleep $(((${FE_READY_FAILURE_THRESHOLD:-3} + 1) * (${FE_READY_PERIOD_SECONDS:-5} + ${FE_READY_TIMEOUT_SECONDS:-5})))
                  until [ "$(curl $CURL_OPTS -o /dev/null -w "%{http_code}" -X POST $http://localhost:$8000/reject 2>/dev/null)" = "200" ]; do
                    check_process_alive || exit 0
                    sleep 1
                  done
                  # 等待keep alive连接全部断掉 该值需要大于fe的uvicorn配置的timeout_keep_alive
                  sleep 70
                  while check_process_alive; do
                    ongoing=$(curl $CURL_OPTS $http://localhost:$8000/metrics 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('ongoing_requests',1))" 2>/dev/null)
                    [ "$ongoing" = "0" ] && break
                    sleep 5
                  done
                  kill -9 1
          resources:
            limits:
              cpu: "2"
              memory: 10Gi
            requests:
              cpu: "2"
              memory: 10Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 60
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
      volumes:
        - name: xds-framework-config-volume
          configMap:
            name: xds-framework-config
        - name: scc-ks
          emptyDir: {}
        - name: cloud-log-volume
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: ray.io/group
                  operator: In
                  values:
                  - frontGroup
              namespaceSelector: {}
              topologyKey: kubernetes.io/hostname
            weight: 100
      tolerations:
        - key: xds/node-monitor-taint
          operator: Exists
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 2100
