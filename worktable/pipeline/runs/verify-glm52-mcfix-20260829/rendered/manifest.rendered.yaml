    app: frontend-executor
    xds-component: frontend
  # externalTrafficPolicy: Cluster
  ports:
              - name: frontend-port
                nodePort: 30076
                port: 8000
                protocol: TCP
                targetPort: 8000
  # type: LoadBalancer
  type: NodePort
