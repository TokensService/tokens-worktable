global:
  annotations:
    ray.io/external-storage-namespace: my-raycluster-storage
    ray.io/ft-enabled: 'true'
    ray.io/overwrite-container-cmd: 'true'
  enableAutomountServiceAccountToken: true
  restartPolicy:
    head: OnFailure
    worker: OnFailure
  fullnameOverride: ''
  imagePullPolicy: IfNotPresent
  imageRegistry: swr.cn-southwest-283.myhuaweicloud.com/serverlessai
  images:
    ray: xds:0730_dev_bnt3_mc_fix.20260828212101.BNT3.x86_64
  nameOverride: kuberay
  namespace: xds-glm-5.2-nvfp4-local
  useFemFrontend: true
  network:
    ports:
    - name: frontend-port
      port: 8000
      protocol: TCP
      targetPort: 8000
      nodePort: 30076
  redis:
    redisEnable: false
    redisSslEnable: false
  scc:
    enable: false
  service:
    svcName: ray-svc
  ssl:
    grpcSslEnable: false
    httpSslEnable: false
  storage:
    hostPath: /mnt/paas
    mountPath: /home/service/works/models_ssd
  roleName: xds-glm-5.2-nvfp4-local-role
  roleBindingName: xds-glm-5.2-nvfp4-local-role-binding
  serviceAccountName: xds-glm-5.2-nvfp4-local-sa
  serviceAccountSecretName: xds-glm-5.2-nvfp4-local-sa-secret
  enableTaskExecutorGroups: true
  taskExecutorGroupType: card
head:
  annotations: {}
  args:
  - source /home/service/.bashrc; ulimit -n 65536; source /usr/local/xds_cpp/script/setenv.bash;
    sh /home/service/prelaunch/clear_log.sh & (for i in {1..20}; do echo "wait $i
    s"; sleep 1; done; ray status; python3 /home/service/prelaunch/check_work_pod_status.py;
    xds --port 8000 --host 0.0.0.0 --route-prefix=/xds/v1) & $(KUBERAY_GEN_RAY_START_CMD)
  command:
  - /bin/bash
  - -lc
  - --
  containerEnv:
  - name: RAY_redis_db_connect_retries
    value: '300'
  - name: RAY_redis_db_connect_wait_milliseconds
    value: '1000'
  - name: RAY_gcs_rpc_server_reconnect_timeout_s
    value: '3600'
  - name: RAY_health_check_failure_threshold
    value: '60'
  - name: RAY_health_check_period_ms
    value: '5000'
  - name: RAY_SERVE_PROXY_HEALTH_CHECK_TIMEOUT_S
    value: '90'
  - name: RAY_SERVE_PROXY_READY_CHECK_TIMEOUT_S
    value: '90'
  - name: RAY_SERVE_PROXY_HEALTH_CHECK_PERIOD_S
    value: '120'
  - name: RAY_grpc_client_keepalive_timeout_ms
    value: '300000'
  enableInTreeAutoscaling: true
  envFrom: []
  labels: {}
  livenessProbe:
    exec:
      command:
      - bash
      - -c
      - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success
        && wget -T 2 -q -O- http://$POD_IP:8265/api/gcs_healthz | grep success
    failureThreshold: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  nodeSelector: {}
  ports:
  - containerPort: 6379
    name: gcs
  - containerPort: 8265
    name: dashboard
  - containerPort: 10001
    name: client
  - containerPort: 44217
    name: as-metrics
  - containerPort: 44227
    name: dash-metrics
  rayStartParams:
    system-config: '"{\"gcs_server_rpc_server_thread_num\": 32, \"gcs_server_rpc_client_thread_num\":
      32}"'
    dashboard-agent-grpc-port: 10013
    dashboard-agent-listen-port: 52365
    dashboard-host: $POD_IP
    dashboard-port: 8265
    max-worker-port: 19999
    metrics-export-port: 10014
    min-worker-port: 10020
    node-manager-port: 10010
    num-cpus: 0
    object-manager-port: 10011
    port: 6379
    ray-client-server-port: 10001
    redis-shard-ports: 10002
    runtime-env-agent-port: 10012
  rayVersion: 2.34.0
  readinessProbe:
    exec:
      command:
      - bash
      - -c
      - timeout 10 bash -c "/bin/bash /opt/xds/script/check_net_connect.sh" || true
        && wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep
        success && wget -T 2 -q -O- http://$POD_IP:8265/api/gcs_healthz | grep success
    failureThreshold: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 20
  startupProbe:
    exec:
      command:
      - bash
      - -c
      - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success
    failureThreshold: 60
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  resources:
    limits:
      cpu: '12'
      memory: 32Gi
    requests:
      cpu: '12'
      memory: 32Gi
  securityContext:
    privileged: true
    runAsGroup: 1000
    runAsUser: 1000
    capabilities:
      add:
      - NET_ADMIN
    seccompProfile:
      type: RuntimeDefault
  sidecarContainers: []
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: ray.io/node-type
          operator: In
          values:
          - head
      namespaceSelector: {}
      topologyKey: kubernetes.io/hostname
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: ray.io/node-type
            operator: In
            values:
            - head
        namespaceSelector: {}
        topologyKey: topology.kubernetes.io/zone
      weight: 100
  volumeMounts:
  - mountPath: /opt/cloud/logs/ray
    name: ray-log-volume
  - mountPath: /opt/cloud/logs/xds
    name: xds-log-volume
  - mountPath: /etc/xds/config/common
    name: xds-common-config-volume
  - mountPath: /etc/xds/config/framework
    name: xds-framework-config-volume
  volumes:
  - emptyDir: {}
    name: ray-log-volume
  - emptyDir: {}
    name: xds-log-volume
  - name: xds-common-config-volume
    configMap:
      name: xds-common-config
  - name: xds-framework-config-volume
    configMap:
      name: xds-framework-config
taskExecutorGroups:
- name: taskExecutorGroup4prefill1
  replicas: 1
  nodeSelector:
    xds.optest: node-78-128-243
  resources: '{"GPU-BNT3-POD": 4, "XDS-TE": 4, "prefill": 1}'
  containerEnvOverrides: {}
  portsOverrides:
    metrics: 33200
  rayStartParamsPorts:
    num-gpus: 4
    dashboard-agent-listen-port: 33300
  containerResources:
    limits:
