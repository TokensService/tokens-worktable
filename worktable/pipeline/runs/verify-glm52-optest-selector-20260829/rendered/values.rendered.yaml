feTemplate:
  default_replica: 10
  annotations:
    max_count_on_node: '10'
  containerEnv: []
  command:
  - /bin/bash
  - -c
  - --
  args:
  - source /home/service/.bashrc; ulimit -n 65536; source /usr/local/xds_cpp/script/setenv.bash;
    python3 /home/service/prelaunch/check_max_pod_config.py || exit 1; ray start --address=$RAY_ADDRESS;
    exec python3 -m xds.frontend.frontend_executor_main --fe-id=$POD_NAME --fem-endpoint=FrontendExecutorManager
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: ray.io/group
            operator: In
            values:
            - frontGroup
        namespaceSelector: {}
        topologyKey: kubernetes.io/hostname
      weight: 100
  labels: {}
  terminationGracePeriodSeconds: 2100
  lifecycle:
    preStop:
      exec:
        command:
        - /bin/bash
        - -c
        - "CURL_OPTS=\"-s --connect-timeout 3 --max-time 10\"\nif [ \"$FE_SCHEME\"\
          \ = \"https\" ]; then\n  CURL_OPTS=\"$CURL_OPTS -k --cert $SSL_DIR/module.crt\
          \ --key $SSL_DIR/module.key\"\n  CERT_PASS=$(python3 -c \"from xds.config.constants\
          \ import ENABLE_SENSITIVE_INFO_DECRYPT; from xds.framework.utils.scc_util\
          \ import decrypt_pad; pwd=open('$SSL_DIR/cert_pwd').read().strip(); print(decrypt_pad(pwd)\
          \ if ENABLE_SENSITIVE_INFO_DECRYPT else pwd)\" 2>/dev/null)\n  if [ -n \"\
          $CERT_PASS\" ]; then CURL_OPTS=\"$CURL_OPTS --pass $CERT_PASS\"; fi\nfi\n\
          check_process_alive() { kill -0 1 2>/dev/null; }\nuntil [ \"$(curl $CURL_OPTS\
          \ -o /dev/null -w \"%{http_code}\" -X POST $http://localhost:$8000/drain\
          \ 2>/dev/null)\" = \"200\" ]; do\n  check_process_alive || exit 0\n  sleep\
          \ 1\ndone\nsleep $(((${FE_READY_FAILURE_THRESHOLD:-3} + 1) * (${FE_READY_PERIOD_SECONDS:-5}\
          \ + ${FE_READY_TIMEOUT_SECONDS:-5})))\nuntil [ \"$(curl $CURL_OPTS -o /dev/null\
          \ -w \"%{http_code}\" -X POST $http://localhost:$8000/reject 2>/dev/null)\"\
          \ = \"200\" ]; do\n  check_process_alive || exit 0\n  sleep 1\ndone\n# 等待keep\
          \ alive连接全部断掉 该值需要大于fe的uvicorn配置的timeout_keep_alive\nsleep 70\nwhile check_process_alive;\
          \ do\n  ongoing=$(curl $CURL_OPTS $http://localhost:$8000/metrics 2>/dev/null\
          \ | python3 -c \"import sys,json; print(json.load(sys.stdin).get('ongoing_requests',1))\"\
          \ 2>/dev/null)\n  [ \"$ongoing\" = \"0\" ] && break\n  sleep 5\ndone\nkill\
          \ -9 1\n"
  nodeSelector: {}
  tolerations:
  - key: xds/node-monitor-taint
    operator: Exists
  livenessProbe:
    httpGet:
      path: /health
    failureThreshold: 60
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
    failureThreshold: 3
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 5
  startupProbe:
    httpGet:
      path: /health
    failureThreshold: 60
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  resources:
    limits:
      cpu: '2'
      memory: 10Gi
    requests:
      cpu: '2'
      memory: 10Gi
