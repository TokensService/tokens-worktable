[project]
name = "op-test"
version = "0.1.0"
description = "Automated model deployment and profiling tool"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "langgraph>=0.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
op-test = "op_test.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
